.tk-reminder-dialog {
  width: min(1120px, calc(100vw - 40px));
  max-width: none;
  max-height: calc(100dvh - 40px);
  padding: 0;
  margin: auto;
  border: 0;
  border-radius: 10px;
  color: var(--text);
  background: var(--surface);
  box-shadow: 0 20px 70px rgba(24, 35, 49, .2);
  overflow: hidden;
  font: inherit;
  font-size: 18px;
}

.tk-reminder-dialog::backdrop { background: rgba(36, 49, 64, .4); }
.tk-reminder-dialog[open] { display: flex; }
.tk-reminder-dialog--history { width: min(1320px, calc(100vw - 40px)); }
.tk-reminder-dialog * { box-sizing: border-box; }
.tk-reminder-form { display: flex; flex-direction: column; width: 100%; min-height: 0; margin: 0; }
.tk-reminder-header { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 24px 28px 18px; flex-shrink: 0; }
.tk-reminder-header h2 { margin: 0; font-size: 25px; line-height: 1.4; font-weight: 650; }
.tk-reminder-close { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 8px; color: #607187; padding: 10px; }
.tk-reminder-close:hover { background: var(--hover); color: var(--text); }
.tk-reminder-close .icon { width: 24px; height: 24px; }
.tk-reminder-close span { font-size: 32px; line-height: 1; }
.tk-reminder-body { min-height: 0; overflow: auto; padding: 12px 28px 24px; scrollbar-width: thin; overscroll-behavior: contain; scroll-padding: 16px; }
.tk-reminder-columns { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; }
.tk-reminder-dialog--history .tk-reminder-columns { grid-template-columns: minmax(0, 1.6fr) minmax(330px, 1fr); }
.tk-reminder-main { min-width: 0; }
.tk-reminder-material { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin-bottom: 28px; }
.tk-reminder-material h3 { margin: 0; padding: 13px 18px; background: #f6f8fa; font-size: 19px; line-height: 1.5; font-weight: 600; }
.tk-reminder-material-content { padding: 18px; }
.tk-reminder-material-identity { display: flex; align-items: center; gap: 18px; min-width: 0; margin-bottom: 22px; }
.tk-reminder-material-identity img { width: 96px; height: 76px; object-fit: cover; border-radius: 8px; flex-shrink: 0; }
.tk-reminder-material-identity strong { display: block; font-size: 21px; line-height: 1.4; font-weight: 600; overflow-wrap: anywhere; }
.tk-reminder-material-identity p { margin: 5px 0 0; font-size: 18px; color: #687b98; overflow-wrap: anywhere; }
.tk-reminder-material-facts { display: grid; grid-template-columns: .7fr 1.3fr 1.1fr 1fr .8fr; margin: 0; gap: 0; }
.tk-reminder-material-facts > div { min-width: 0; padding: 0 18px; border-left: 1px solid var(--line); }
.tk-reminder-material-facts > div:first-child { border-left: 0; padding-left: 0; }
.tk-reminder-material-facts > div:last-child { padding-right: 0; }
.tk-reminder-material-facts dt { margin-bottom: 7px; color: #687b98; font-size: 18px; overflow-wrap: anywhere; }
.tk-reminder-material-facts dd { margin: 0; font-size: 19px; font-weight: 550; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.tk-reminder-tag { display: inline-block; padding: 3px 10px; background: #fff0f0; color: var(--red); border-radius: 5px; font-size: 18px; font-weight: 500; }
.tk-reminder-tag--neutral { background: #f2f4f6; color: #718094; }
.tk-reminder-field { display: grid; grid-template-columns: 155px minmax(0, 1fr); gap: 18px; align-items: start; margin: 26px 0; }
.tk-reminder-label { padding-top: 4px; font-size: 18px; font-weight: 600; line-height: 1.6; }
.tk-reminder-required { color: #d14c4c; margin-left: 8px; }
.tk-reminder-recipients { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); margin: 0; }
.tk-reminder-recipients > div { padding: 0 24px; border-left: 1px solid var(--line); min-width: 0; }
.tk-reminder-recipients > div:first-child { padding-left: 0; border-left: 0; }
.tk-reminder-recipients dt { font-size: 18px; font-weight: 550; }
.tk-reminder-recipients dd { margin: 6px 0 0; color: #687b98; font-size: 18px; overflow-wrap: anywhere; }
.tk-reminder-check { display: inline-flex; align-items: center; gap: 12px; min-height: 32px; font-size: 18px; line-height: 1.5; }
.tk-reminder-check input { width: 22px; height: 22px; margin: 0; flex-shrink: 0; accent-color: var(--green); }
.tk-reminder-textarea-wrap { position: relative; min-width: 0; }
.tk-reminder-textarea-wrap textarea { display: block; width: 100%; min-height: 302px; padding: 14px 18px 43px; margin: 0; resize: vertical; border: 1px solid var(--line); border-radius: 8px; color: #62738c; background: #f7f9fc; font: inherit; font-size: 18px; line-height: 1.65; }
.tk-reminder-textarea-wrap textarea:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
.tk-reminder-character-count { position: absolute; bottom: 12px; right: 18px; color: #687b98; font-size: 18px; background: #f7f9fc; line-height: 1.3; }
.tk-reminder-content-field { margin-bottom: 0; }
.tk-reminder-history { min-width: 0; padding: 20px; border: 1px solid var(--line); border-radius: 8px; }
.tk-reminder-history h3 { margin: 0 0 18px; font-size: 21px; line-height: 1.5; font-weight: 600; }
.tk-reminder-history-count { display: flex; align-items: baseline; gap: 8px; margin: 0 0 28px; padding: 12px 16px; background: var(--mint); color: var(--green); border-radius: 6px; font-size: 18px; }
.tk-reminder-history-count strong { font-size: 27px; line-height: 1.2; font-weight: 650; }
.tk-reminder-timeline { list-style: none; padding: 0 0 0 20px; margin: 0; border-left: 2px solid #e7ecef; }
.tk-reminder-timeline li { position: relative; padding: 0 0 30px; }
.tk-reminder-timeline li:last-child { padding-bottom: 0; }
.tk-reminder-timeline li::before { content: ''; position: absolute; left: -27px; top: 7px; width: 12px; height: 12px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 4px #fff; }
.tk-reminder-timeline time { display: block; margin-bottom: 18px; color: #50627d; font-size: 18px; font-variant-numeric: tabular-nums; }
.tk-reminder-timeline dl { margin: 0; }
.tk-reminder-timeline dl > div { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; margin: 8px 0; font-size: 18px; line-height: 1.7; color: #687b98; }
.tk-reminder-timeline dd { margin: 0; white-space: pre-line; overflow-wrap: anywhere; }
.tk-reminder-history-empty { margin: 0; font-size: 18px; color: var(--muted); }
.tk-reminder-footer { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 18px 28px 22px; border-top: 1px solid #f0f2f5; background: var(--surface); flex-shrink: 0; }
.tk-reminder-footer-copy { min-width: 0; }
.tk-reminder-footer-copy p { margin: 8px 0 0; font-size: 18px; color: var(--muted); line-height: 1.5; }
.tk-reminder-record-info { display: inline-flex; flex-shrink: 0; color: #687b98; }
.tk-reminder-record-info .icon { width: 19px; height: 19px; }
.tk-reminder-actions { display: flex; align-items: center; gap: 14px; flex-shrink: 0; }
.tk-reminder-actions .button { min-height: 48px; min-width: 128px; border-radius: 6px; font-size: 18px; }
.tk-reminder-dialog button:focus-visible,.tk-reminder-dialog input:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }

@media (max-width: 1080px) {
  .tk-reminder-dialog--history .tk-reminder-columns { grid-template-columns: minmax(0, 1fr); }
  .tk-reminder-field { grid-template-columns: 145px minmax(0, 1fr); }
}

@media (max-width: 700px) {
  .tk-reminder-dialog,.tk-reminder-dialog--history { width: calc(100vw - 24px); max-height: calc(100dvh - 24px); }
  .tk-reminder-header { padding: 18px 18px 12px; }
  .tk-reminder-body { padding: 8px 18px 18px; }
  .tk-reminder-material-content { padding: 16px; }
  .tk-reminder-material-facts { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
  .tk-reminder-material-facts > div { border-left: 0; padding: 0; }
  .tk-reminder-field { grid-template-columns: minmax(0, 1fr); gap: 12px; margin-top: 24px; }
  .tk-reminder-recipients > div { padding-right: 10px; padding-left: 18px; }
  .tk-reminder-footer { align-items: stretch; flex-direction: column; padding: 16px 18px 18px; gap: 16px; }
  .tk-reminder-actions { justify-content: flex-end; }
  .tk-reminder-check { align-items: flex-start; }
  .tk-reminder-check input { margin-top: 3px; }
}

@media (max-width: 400px) {
  .tk-reminder-actions .button { min-width: 0; flex: 1; }
  .tk-reminder-actions { width: 100%; }
  .tk-reminder-material-identity { gap: 12px; }
  .tk-reminder-material-identity img { width: 76px; height: 66px; }
  .tk-reminder-timeline dl > div { grid-template-columns: minmax(0, 1fr); gap: 0; }
}

/*
 * Screenshot-led preview theme, 2026-10-15.
 * Source: the user's Simple design dashboard reference; candidate preview values.
 * App behavior, field meanings and existing responsive grid breakpoints stay unchanged.
 */
:root {
  --page: #f6f9fa;
  --surface: #ffffff;
  --line: #e9efee;
  --text: #192324;
  --muted: #6b7678;
  --green: #007f6b;
  --mint: #e9f9f3;
  --simple-mint-brand: #00b89b;
  --accent: var(--simple-mint-brand);
  --hover: #f3faf7;
  --red: #c95050;
  --down: #1c7d66;
  --focus: #007f6b;
  --radius: 6px;
  --shadow: 0 1px 2px rgba(28, 66, 61, .025);
  --mint-on-accent: #03332d;
  --mint-outer: #e8f7fd;
}

/* Advertising overview: source order and snapshot fields, with the shared mint visual theme. */
.overview-page { min-width: 0; }
.overview-page .overview-filters { grid-template-columns: minmax(300px,1.6fr) minmax(140px,1fr) repeat(2,minmax(120px,.8fr)) minmax(140px,1fr) auto; }
.overview-page .filter-panel { padding-bottom: 20px; }
.overview-page .filter-actions { justify-content: flex-end; }
.overview-page .overview-monitoring .metric-grid { grid-template-columns: repeat(5,minmax(0,1fr)); }
.overview-page .overview-results .metric-grid { grid-template-columns: repeat(6,minmax(0,1fr)); }
.overview-page .metric-value { font-size: clamp(28.5px,1.6vw,34.5px); white-space: nowrap; }
.overview-insights { display: grid; grid-template-columns: 1.35fr 1fr 1.1fr 1.25fr; gap: 14px; margin: 24px 0; }
.overview-panel { min-width: 0; padding: 22px; border-radius: 6px; background: #fff; box-shadow: var(--shadow); }
.overview-panel-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; min-height: 44px; }
.overview-panel-header h2 { margin: 0; color: var(--text); font-size: 22.5px; line-height: 1.5; font-weight: 600; }
.overview-panel-header .tk-select { width: 112px; flex: none; }
.overview-panel-header select { width: 112px; }
.overview-view-all { padding: 4px 0; flex: none; color: var(--green); font-size: 18px; line-height: 1.5; }
.overview-view-all:hover { text-decoration: underline; }
.overview-chart-legend { display: flex; align-items: center; flex-wrap: wrap; gap: 20px; color: var(--muted); font-size: 18px; margin-bottom: 16px; }
.overview-chart-legend > span { display: flex; align-items: center; gap: 8px; }
.overview-chart-legend > span::before { content: ''; width: 9px; height: 9px; border-radius: 50%; background: var(--accent); }
.overview-chart-legend .overview-spend-dot::before { background: #7daee2; }
.overview-trend-figure { display: grid; grid-template-columns: 40px minmax(0,1fr); gap: 10px; padding-right: 5px; }
.overview-trend-y { height: 180px; display: flex; flex-direction: column; justify-content: space-between; text-align: right; color: var(--muted); font-size: 18px; line-height: 1; }
.overview-trend-plot { min-width: 0; padding: 4px 0 0; }
.overview-trend-plot > svg { display: block; width: 100%; height: 174px; overflow: visible; }
.overview-grid-line { stroke: #edf3f2; stroke-width: 1; }
.overview-trend-line { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
.overview-trend-line.is-income { stroke: var(--accent); }
.overview-trend-line.is-spend { stroke: #7daee2; }
.overview-trend-point { fill: #fff; stroke-width: 1.8; }
.overview-trend-point.is-income { stroke: var(--accent); }
.overview-trend-point.is-spend { stroke: #7daee2; }
.overview-chart-dates { display: flex; justify-content: space-between; gap: 5px; margin: 16px -8px 0; color: var(--muted); font-size: 18px; white-space: nowrap; }
.overview-bars { display: grid; grid-template-columns: 30px minmax(0,1fr); gap: 10px; padding-top: 28px; }
.overview-bars-y { height: 180px; display: flex; flex-direction: column; justify-content: space-between; text-align: right; color: var(--muted); font-size: 18px; line-height: 1; }
.overview-bars-plot { display: flex; gap: 14px; border-bottom: 1px solid var(--line); }
.overview-bar-column { flex: 1; min-width: 0; text-align: center; position: relative; }
.overview-bar-track { height: 180px; display: flex; align-items: flex-end; justify-content: center; }
.overview-bar { position: relative; width: 70%; min-width: 18px; background: #bfd9f3; border-radius: 3px 3px 0 0; }
.overview-bar.is-mint { background: #84d5b5; }
.overview-bar > span { position: absolute; bottom: calc(100% + 7px); left: 50%; transform: translateX(-50%); color: #405052; font-size: 18px; }
.overview-bar-label { display: block; margin: 12px -6px -38px; color: var(--muted); font-size: 18px; white-space: nowrap; }
.overview-profit-layout { display: flex; align-items: center; gap: 24px; min-height: 220px; }
.overview-donut { width: 180px; height: 180px; flex: none; display: grid; place-items: center; border-radius: 50%; background: conic-gradient(#58bf97 0 38.7%,#f0c94e 38.7% 91.4%,#c3cbd0 91.4% 100%); }
.overview-donut > div { width: 124px; height: 124px; border-radius: 50%; background: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.overview-donut strong { color: var(--text); font-size: 36px; line-height: 1.25; font-weight: 650; }
.overview-donut > div > span { margin-top: 5px; color: var(--muted); font-size: 18px; }
.overview-profit-legend { display: grid; gap: 18px; margin: 0; padding: 0; list-style: none; font-size: 18px; color: #586568; }
.overview-profit-legend li { display: grid; grid-template-columns: 9px auto auto; align-items: center; gap: 8px; white-space: nowrap; }
.overview-distribution-dot { width: 9px; height: 9px; border-radius: 50%; background: #58bf97; }
.overview-distribution-dot.is-negative { background: #f0c94e; }
.overview-distribution-dot.is-missing { background: #c3cbd0; }
.overview-risk-table-wrap { overflow-x: auto; }
.overview-risk-table { width: 100%; min-width: 360px; border-collapse: collapse; font-size: 18px; }
.overview-risk-table th { font-weight: 500; text-align: left; padding: 0 8px 12px; color: var(--muted); white-space: nowrap; }
.overview-risk-table td { padding: 11px 8px; color: #475559; border-top: 1px solid #f0f4f4; white-space: nowrap; }
.overview-rank { color: #7c96b0; font-variant-numeric: tabular-nums; }
.overview-rank.is-top { color: #c78d4f; }
.overview-risk-product { display: flex; align-items: center; gap: 10px; }
.overview-image-placeholder { width: 34px; height: 34px; display: grid; place-items: center; flex: none; background: #f1f5f5; color: #a8b5b7; border-radius: 4px; }
.overview-image-placeholder .icon { width: 18px; height: 18px; }
.overview-risk-pid { font-variant-numeric: tabular-nums; }
.overview-detail-panel { position: relative; }
.overview-table-viewport { max-height: none; }
.overview-page .overview-table th { white-space: normal; }
.overview-table th small { display: block; margin-top: 7px; color: var(--muted); font-size: 18px; font-weight: 400; }
.overview-page .overview-table th.overview-paid-group { text-align: center; background: var(--mint); color: var(--green); font-size: 18px; padding: 10px 16px; }
.overview-paid-group .icon { width: 20px; height: 20px; margin-right: 8px; }
.overview-page .overview-table td { vertical-align: middle; font-size: 18px; }
.overview-table .overview-cell-value { display: block; color: #364548; font-variant-numeric: tabular-nums; }
.overview-cell-change { display: block; margin-top: 7px; font-size: 18px; white-space: nowrap; }
.overview-cell-change.up { color: var(--red); }
.overview-cell-change.down { color: var(--down); }
.overview-content-values { display: grid; gap: 2px; margin: 0; color: #58686b; font-size: 18px; }
.overview-content-values > div { display: grid; grid-template-columns: 42px auto; gap: 8px; }
.overview-content-values dt { color: var(--muted); }
.overview-content-values dd { margin: 0; font-variant-numeric: tabular-nums; }
.overview-judgment { justify-content: center; min-width: 78px; background: var(--mint); color: var(--green); }
.overview-judgment.is-negative { background: #fff0ef; color: var(--red); }
.overview-detail.button { min-height: 42px; color: var(--green); border-color: #b4e3d8; font-size: 18px; }
.overview-detail.button:hover { background: var(--mint); border-color: var(--accent); }
.overview-empty { padding: 38px 22px !important; color: var(--muted) !important; }
.overview-fields { right: 18px; top: 72px; }
@media(max-width:2200px) { .overview-insights { grid-template-columns: repeat(2,minmax(0,1fr)); } }
@media(min-width:1501px) { .overview-page .overview-results .metric-value { font-size: clamp(26.5px,1.4vw,32px); } }
@media(max-width:1500px) { .overview-page .overview-results .metric-grid { grid-template-columns: repeat(3,minmax(0,1fr)); } }
@media(max-width:1450px) { .overview-page .overview-filters { grid-template-columns: minmax(300px,1.4fr) repeat(2,minmax(170px,1fr)); } }
@media(max-width:1500px) { .overview-page .overview-monitoring .metric-grid { grid-template-columns: repeat(6,minmax(0,1fr)); }.overview-page .overview-monitoring .metric { grid-column: span 2; }.overview-page .overview-monitoring .metric:nth-child(n+4) { grid-column: span 3; } }
@media(max-width:1250px) { .overview-page .overview-filters { grid-template-columns: repeat(2,minmax(0,1fr)); }.overview-page .date-field,.overview-page .filter-actions { grid-column: 1/-1; }.overview-page .overview-results .metric-grid { grid-template-columns: repeat(2,minmax(0,1fr)); }.overview-profit-layout { gap: 16px; flex-wrap: wrap; }.overview-profit-legend { flex: 1; } }
@media(max-width:1000px) { .overview-insights { grid-template-columns: minmax(0,1fr); }.overview-panel { padding: 20px; }.overview-profit-layout { flex-wrap: nowrap; }.overview-profit-legend { flex: none; } }
@media(max-width:700px) { .overview-page .overview-filters { grid-template-columns: 1fr; }.overview-page .date-field { grid-column: auto; }.overview-page .filter-actions .button { flex: 1; }.overview-panel { padding: 18px; }.overview-profit-layout { flex-wrap: wrap; }.overview-profit-legend { flex: 1; }.overview-page .overview-monitoring .metric-grid,.overview-page .overview-results .metric-grid { grid-template-columns: 1fr; }.overview-page .overview-monitoring .metric:nth-child(n) { grid-column: auto; }.overview-chart-dates { flex-wrap: wrap; gap: 5px 10px; }.overview-panel-header { flex-wrap: wrap; }.overview-donut { width: 160px; height: 160px; }.overview-donut > div { width: 110px; height: 110px; } }

et))closeFields();\n      const sortButton=event.target.closest('[data-sort]');\n      if(sortButton){const key=sortButton.dataset.sort;const asc=sortState?.key===key?!sortState.asc:false;sortState={key,asc};rows.sort((a,b)=>{const av=sortValue(a,key);const bv=sortValue(b,key);if(Number.isNaN(av)&&Number.isNaN(bv))return 0;if(Number.isNaN(av))return 1;if(Number.isNaN(bv))return -1;return asc?av-bv:bv-av});const sortSelect=document.getElementById('gmv-sort');sortSelect.value='custom';sortSelect.dispatchEvent(new Event('change',{bubbles:true}));renderTable();}\n      if(event.target.closest('.local-nav'))notify('此 HTML 仅展示产品广告页的视觉预览。');\n    });\n    document.addEventListener('keydown',event=>{if(event.key==='Escape'){const wasOpen=!fields.hidden;closeInfo();closeFields();if(wasOpen)fieldsButton.focus();}});\n    document.getElementById('table-viewport').addEventListener('scroll',closeInfo);\n    window.addEventListener('resize',closeInfo);\n    document.getElementById('collapse-sidebar').addEventListener('click',()=>{const collapsed=document.body.classList.toggle('sidebar-collapsed');document.getElementById('collapse-sidebar').setAttribute('aria-expanded',String(!collapsed));document.getElementById('collapse-sidebar').setAttribute('aria-label',collapsed?'展开侧边栏':'收起侧边栏');});\n    document.getElementById('ads-menu').addEventListener('click',()=>{const subnav=document.getElementById('ads-subnav');subnav.hidden=!subnav.hidden;document.getElementById('ads-menu').setAttribute('aria-expanded',String(!subnav.hidden));});\n    document.getElementById('filters').addEventListener('submit',event=>{event.preventDefault();notify('视觉预览保留当前页面快照；其他日期和筛选结果需在原系统查询。');});\n    document.getElementById('filters').addEventListener('reset',()=>{rows=[...snapshot.rows];sortState=null;renderTable();});\n  \u003c/script>\n  \u003cscript>\n/* Visual enhancement only: native selects remain the form and value source. */\n(() => {\n  'use strict';\n  let opened = null;\n  const close = (restoreFoc   }

  const controller = new AbortController();
  const panels = [];
  const listen = (target, type, handler, options = {}) => target.addEventListener(type, handler, {
    ...(typeof options === 'boolean' ? { capture: options } : options), signal: controller.signal,
  });
  let opened = null;
  const close = (restoreFocus = false) => {
    if (!opened) return;
    const widget = opened;
    opened = null;
    widget.panel.hidden = true;
    widget.trigger.setAttribute('aria-expanded', 'false');
    widget.trigger.removeAttribute('aria-activedescendant');
    widget.trigger.classList.remove('is-open');
    if (restoreFocus) widget.trigger.focus();
  };

  function enhance(select) {
    const label = select.labels[0];
    const wrapper = document.createElement('div');
    wrapper.className = 'tk-select';
    select.before(wrapper);
    wrapper.append(select);
    const trigger = document.createElement('button');
    trigger.type = 'button';
    trigger.className = 'tk-select-trigger';
    trigger.id = `${select.id}-trigger`;
    trigger.setAttribute('role', 'combobox');
    trigger.setAttribute('aria-haspopup', 'listbox');
    trigger.setAttribute('aria-expanded', 'false');
    trigger.setAttribute('aria-controls', `${select.id}-listbox`);
    trigger.innerHTML = '<span class="tk-select-value"></span><svg class="tk-select-chevron" viewBox="0 0 16 16" aria-hidden="true"><path d="m4 6 4 4 4-4"/></svg>';
    const value = trigger.querySelector('.tk-select-value');
    value.id = `${select.id}-value`;
    if (label) {
      label.id ||= `${select.id}-label`;
      trigger.setAttribute('aria-labelledby', `${label.id} ${value.id}`);
      listen(label, 'click', event => {
        event.preventDefault();
        trigger.focus();
      });
    } else {
      trigger.setAttribute('aria-label', select.getAttribute('aria-label') || select.name);
    }
    wrapper.append(trigger);
    const panel = document.createElement('div');
    panel.className = 'tk-select-menu';
    panel.id = `${select.id}-listbox`;
    panel.setAttribute('role', 'listbox');
    if (label) panel.setAttribute('aria-labelledby', label.id);
    panel.hidden = true;
    document.body.append(panel);
    panels.push(panel);
    const options = Array.from(select.options).filter(option => !option.hidden);
    const items = options.map((option, index) => {
      const item = document.createElement('div');
      item.className = 'tk-select-option';
      item.id = `${select.id}-option-${index}`;
      item.setAttribute('role', 'option');
      item.setAttribute('aria-disabled', String(option.disabled));
      const text = document.createElement('span');
      text.textContent = option.label;
      const check = document.createElement('span');
      check.className = 'tk-select-check';
      check.setAttribute('aria-hidden', 'true');
      check.innerHTML = '<svg viewBox="0 0 16 16"><path d="m3 8 3 3 7-7"/></svg>';
      item.append(text, check);
      panel.append(item);
      listen(item, 'pointermove', () => {
        if (!option.disabled) activate(index);
      });
      listen(item, 'click', () => {
        if (!option.disabled) commit(index);
      });
      return item;
    });
    const enabled = options.map((option, index) => option.disabled ? -1 : index)
      .filter(index => index !== -1);
    let active = -1;
    const widget = { trigger, panel, position };

    function sync() {
      value.textContent = select.selectedOptions[0]?.label || '';
      trigger.disabled = select.disabled;
      items.forEach((item, index) => {
        item.setAttribute('aria-selected', String(options[index].selected));
      });
    }
    function activate(index) {
      active = index;
      items.forEach((item, current) => item.classList.toggle('is-active', current === index));
      const item = items[index];
      if (!item) return;
      trigger.setAttribute('aria-activedescendant', item.id);
      if (item.offsetTop < panel.scrollTop) panel.scrollTop = item.offsetTop;
      if (item.offsetTop + item.offsetHeight > panel.scrollTop + panel.clientHeight) {
        panel.scrollTop = item.offsetTop + item.offsetHeight - panel.clientHeight;
      }
    }
    function position() {
      const rect = trigger.getBoundingClientRect();
      const edge = 12;
      const gap = 6;
      const width = Math.min(Math.max(220, rect.width), innerWidth - edge * 2);
      const below = Math.max(0, innerHeight - edge - rect.bottom - gap);
      const above = Math.max(0, rect.top - edge - gap);
      panel.style.width = `${width}px`;
      const height = Math.min(264, panel.scrollHeight);
      const upward = below < height && above > below;
      panel.style.maxHeight = `${Math.min(264, upward ? above : below)}px`;
      panel.style.left = `${Math.max(edge, Math.min(rect.left, innerWidth - width - edge))}px`;
      panel.style.top = `${upward ? rect.top - gap - panel.getBoundingClientRect().height : rect.bottom + gap}px`;
    }
    function open() {
      if (select.disabled || !enabled.length) return;
      close();
      sync();
      opened = widget;
      panel.hidden = false;
      trigger.setAttribute('aria-expanded', 'true');
      trigger.classList.add('is-open');
      position();
      const selected = options.findIndex(option => option.selected && !option.disabled);
      activate(selected === -1 ? enabled[0] : selected);
    }
    function commit(index) {
      const option = options[index];
      if (!option || option.disabled) return;
      const changed = select.selectedIndex !== option.index;
      select.selectedIndex = option.index;
      sync();
      if (changed) {
        select.dispatchEvent(new Event('input', { bubbles: true }));
        select.dispatchEvent(new Event('change', { bubbles: true }));
      }
      close(true);
    }
    listen(trigger, 'click', () => opened === widget ? close(true) : open());
    listen(trigger, 'keydown', event => {
      const key = event.key;
      if (key === 'Tab') { if (opened === widget) close(); return; }
      if (key === 'Escape') {
        if (opened === widget) { event.preventDefault(); close(true); }
        return;
      }
      if (!['ArrowDown', 'ArrowUp', 'Home', 'End', 'Enter', ' '].includes(key)) return;
      event.preventDefault();
      const wasOpen = opened === widget;
      if (!wasOpen) open();
      if (opened !== widget) return;
      if (key === 'Home') activate(enabled[0]);
      else if (key === 'End') activate(enabled[enabled.length - 1]);
      else if (wasOpen && (key === 'Enter' || key === ' ')) commit(active);
      else if (wasOpen && (key === 'ArrowDown' || key === 'ArrowUp')) {
        const step = key === 'ArrowDown' ? 1 : -1;
        const next = Math.max(0, Math.min(enabled.length - 1, enabled.indexOf(active) + step));
        activate(enabled[next]);
      }
    });
    listen(select, 'change', sync);
    listen(select, 'input', sync);
    select.form && listen(select.form, 'reset', () => {
      if (opened === widget) close();
      setTimeout(sync, 0);
    });
    sync();
    select.classList.add('tk-select-native');
    select.setAttribute('aria-hidden', 'true');
    select.tabIndex = -1;
  }

  container.querySelectorAll('select').forEach(enhance);
  listen(document, 'pointerdown', event => {
    if (opened && !opened.trigger.contains(event.target) && !opened.panel.contains(event.target)) {
      close();
    }
  });
  listen(document, 'focusin', event => {
    if (opened && !opened.trigger.contains(event.target) && !opened.panel.contains(event.target)) {
      close();
    }
  });
  listen(window, 'resize', () => opened?.position());
  listen(window, 'scroll', () => opened?.position(), true);
  return () => { close(); controller.abort(); panels.forEach(panel => panel.remove()); };
}

return {enhanceSelects};
})();
'use strict';

const data = JSON.parse(document.getElementById('page-data').textContent);
const assets = JSON.parse(document.getElementById('asset-data').textContent);
const productBackground = JSON.parse(document.getElementById('product-background').textContent);
const views = {
  overview: '经营概览',
  heating: '加热素材表现', reminders: '达人素材授权提醒',
  organic: '达人素材授权提醒 · 自然流出单数 V0.3.1',
  'first-reminder': '达人素材授权提醒', 'second-reminder': '达人素材授权提醒',
  'product-data': '产品广告 · 商品数据',
  products: '产品广告',
};
const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, character => ({
  '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
})[character]);
const icon = name => `<svg class="icon${name.startsWith('ph-') ? ' ph-icon' : ''}" viewBox="0 0 ${name.startsWith('ph-') ? '256 256' : '24 24'}" aria-hidden="true"><use href="#${escapeHtml(name)}"></use></svg>`;
const assetUrl = path => assets[path] || '';
let currentScreen = null;
let currentDialog = null;
let toastTimer;

function notify(message) {
  const toast = document.getElementById('toast');
  clearTimeout(toastTimer);
  toast.textContent = message;
  toast.hidden = false;
  toastTimer = setTimeout(() => { toast.hidden = true; }, 6500);
}

// Only Lisa's dialog has supplied spend, ROI, operator and history evidence.
function dialogRow(row) {
  const result = {
    name: row.creatorName, subtitle: row.creatorDescription,
    creator: row.creatorName, pid: row.productPid.replace(/^PID/, ''),
    spend: row.spend, roi: row.roi, status: row.authorizationStatus,
    risk: row.risk, bd: row.bdOwner, operator: null,
    reminderCount: row.reminderCount, history: [], thumbnail: row.thumbnail,
  };
  if (row.id === 'home-with-lisa') {
    Object.assign(result, {
      creator: 'Lisa', spend: 4320, roi: '7.41', operator: '李四',
      thumbnail: 'assets/thumbnails/modal-lisa.png', history: [
        { time: '2026-10-07 16:20', recipient: '张三', role: 'BD负责人', status: '未处理' },
        { time: '2026-10-05 11:03', recipient: '李四', role: '运营负责人', status: '跟进中' },
      ],
    });
  }
  return result;
}

function showReminder(row, mode) {
  currentDialog?.close();
  const dialog = ReminderDialogModule.openReminderDialog({
    row: dialogRow(row), mode, icon, escapeHtml, assetUrl, notify,
    onClose: () => { if (currentDialog === dialog) currentDialog = null; },
  });
  currentDialog = dialog;
}

function renderScreen() {
  const requested = location.hash.slice(1) || document.body.dataset.initialView;
  const view = Object.hasOwn(views, requested) ? requested : 'heating';
  currentDialog?.close();
  currentScreen?.cleanup();
  document.body.classList.toggle('product-data-view', view === 'product-data' || view === 'products');
  const content = document.getElementById('screen-content');
  document.getElementById('current-page-label').textContent = views[view];
  document.title = `${views[view]} · TK 广告预览`;
  document.querySelectorAll('[data-view]').forEach(link => {
    const active = link.dataset.view === view || (link.closest('.subnav')
      && link.dataset.view === 'reminders' && !['overview', 'heating', 'products', 'product-data'].includes(view));
    link.classList.toggle('current', active);
    if (active) link.setAttribute('aria-current', 'page');
    else link.removeAttribute('aria-current');
  });
  if (view === 'product-data' || view === 'products') {
    const frame = document.createElement('iframe');
    frame.className = 'product-background';
    frame.title = '原产品广告视觉预览';
    frame.srcdoc = productBackground;
    content.replaceChildren(frame);
    currentScreen = { element: frame, cleanup() { frame.remove(); } };
    if (view === 'product-data') {
      const dialog = ProductDataModule.openProductData({
        data: data['product-data'], icon, escapeHtml, assetUrl, notify,
        onClose: () => {
          if (currentDialog === dialog) currentDialog = null;
          if (location.hash === '#product-data') location.hash = '#products';
        },
      });
      currentDialog = dialog;
    }
  } else if (view === 'overview') {
    const screen = OverviewModule.renderOverview({ data: data.overview, icon, escapeHtml, notify });
    content.replaceChildren(screen.element);
    const removeSelects = SelectModule.enhanceSelects(screen.element);
    currentScreen = { element: screen.element, cleanup() { removeSelects(); screen.cleanup(); } };
  } else if (view === 'heating') {
    currentScreen = HeatingModule.renderHeating({ data: data.heating, icon, escapeHtml, assetUrl, notify });
    content.replaceChildren(currentScreen.element);
  } else {
    const screen = RemindersModule.renderReminders({
      data: data.reminders, variant: view === 'organic' ? 'organic' : 'standard',
      icon, escapeHtml, assetUrl, notify, onRemind: showReminder,
    });
    content.replaceChildren(screen.element);
    const removeSelects = SelectModule.enhanceSelects(screen.element);
    currentScreen = { element: screen.element, cleanup() { removeSelects(); screen.cleanup(); } };
    if (view === 'first-reminder' || view === 'second-reminder') {
      showReminder(data.reminders.rows[0], view === 'first-reminder' ? 'first' : 'history');
    }
  }
}

document.getElementById('collapse-sidebar').addEventListener('click', event => {
  const collapsed = document.body.classList.toggle('sidebar-collapsed');
  event.currentTarget.setAttribute('aria-expanded', String(!collapsed));
  event.currentTarget.setAttribute('aria-label', collapsed ? '展开侧边栏' : '收起侧边栏');
});
document.getElementById('ads-menu').addEventListener('click', event => {
  const subnav = document.getElementById('ads-subnav');
  subnav.hidden = !subnav.hidden;
  event.currentTarget.setAttribute('aria-expanded', String(!subnav.hidden));
});
document.querySelectorAll('.local-nav').forEach(button => button.addEventListener('click', () => {
  notify('此预览仅包含已提供的广告界面。');
}));
document.addEventListener('click', event => {
  const link = event.target.closest('a[data-view]');
  if (link && location.hash === link.hash) { event.preventDefault(); renderScreen(); }
});
window.addEventListener('hashchange', renderScreen);
renderScreen();
</script>
