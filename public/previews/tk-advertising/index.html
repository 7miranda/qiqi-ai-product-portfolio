.tk-reminder-dialog {
  width: min(1120px, calc(100vw - 40px));
  max-width: none;
  max-height: calc(100dvh - 40px);
  padding: 0;
  margin: auto;
  border: 0;
  border-radius: 10px;
  color: var(--text);
  background: var(--surface);
  box-shadow: 0 20px 70px rgba(24, 35, 49, .2);
  overflow: hidden;
  font: inherit;
  font-size: 18px;
}

.tk-reminder-dialog::backdrop { background: rgba(36, 49, 64, .4); }
.tk-reminder-dialog[open] { display: flex; }
.tk-reminder-dialog--history { width: min(1320px, calc(100vw - 40px)); }
.tk-reminder-dialog * { box-sizing: border-box; }
.tk-reminder-form { display: flex; flex-direction: column; width: 100%; min-height: 0; margin: 0; }
.tk-reminder-header { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 24px 28px 18px; flex-shrink: 0; }
.tk-reminder-header h2 { margin: 0; font-size: 25px; line-height: 1.4; font-weight: 650; }
.tk-reminder-close { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 8px; color: #4b605a; padding: 10px; }
.tk-reminder-close:hover { background: var(--hover); color: var(--text); }
.tk-reminder-close .icon { width: 24px; height: 24px; }
.tk-reminder-close span { font-size: 32px; line-height: 1; }
.tk-reminder-body { min-height: 0; overflow: auto; padding: 12px 28px 24px; scrollbar-width: thin; overscroll-behavior: contain; scroll-padding: 16px; }
.tk-reminder-columns { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; }
.tk-reminder-dialog--history .tk-reminder-columns { grid-template-columns: minmax(0, 1.6fr) minmax(330px, 1fr); }
.tk-reminder-main { min-width: 0; }
.tk-reminder-material { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin-bottom: 28px; }
.tk-reminder-material h3 { margin: 0; padding: 13px 18px; background: #eaf0ef; font-size: 19px; line-height: 1.5; font-weight: 600; }
.tk-reminder-material-content { padding: 18px; }
.tk-reminder-material-identity { display: flex; align-items: center; gap: 18px; min-width: 0; margin-bottom: 22px; }
.tk-reminder-material-identity img { width: 96px; height: 76px; object-fit: cover; border-radius: 8px; flex-shrink: 0; }
.tk-reminder-material-identity strong { display: block; font-size: 21px; line-height: 1.4; font-weight: 600; overflow-wrap: anywhere; }
.tk-reminder-material-identity p { margin: 5px 0 0; font-size: 18px; color: #5c7069; overflow-wrap: anywhere; }
.tk-reminder-material-facts { display: grid; grid-template-columns: .7fr 1.3fr 1.1fr 1fr .8fr; margin: 0; gap: 0; }
.tk-reminder-material-facts > div { min-width: 0; padding: 0 18px; border-left: 1px solid var(--line); }
.tk-reminder-material-facts > div:first-child { border-left: 0; padding-left: 0; }
.tk-reminder-material-facts > div:last-child { padding-right: 0; }
.tk-reminder-material-facts dt { margin-bottom: 7px; color: #5c7069; font-size: 18px; overflow-wrap: anywhere; }
.tk-reminder-material-facts dd { margin: 0; font-size: 19px; font-weight: 550; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.tk-reminder-tag { display: inline-block; padding: 3px 10px; background: #fff0f0; color: var(--red); border-radius: 5px; font-size: 18px; font-weight: 500; }
.tk-reminder-tag--neutral { background: #e3eae7; color: #5c7069; }
.tk-reminder-field { display: grid; grid-template-columns: 155px minmax(0, 1fr); gap: 18px; align-items: start; margin: 26px 0; }
.tk-reminder-label { padding-top: 4px; font-size: 18px; font-weight: 600; line-height: 1.6; }
.tk-reminder-required { color: #c95050; margin-left: 8px; }
.tk-reminder-recipients { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); margin: 0; }
.tk-reminder-recipients > div { padding: 0 24px; border-left: 1px solid var(--line); min-width: 0; }
.tk-reminder-recipients > div:first-child { padding-left: 0; border-left: 0; }
.tk-reminder-recipients dt { font-size: 18px; font-weight: 550; }
.tk-reminder-recipients dd { margin: 6px 0 0; color: #5c7069; font-size: 18px; overflow-wrap: anywhere; }
.tk-reminder-check { display: inline-flex; align-items: center; gap: 12px; min-height: 32px; font-size: 18px; line-height: 1.5; }
.tk-reminder-check input { width: 22px; height: 22px; margin: 0; flex-shrink: 0; accent-color: var(--green); }
.tk-reminder-textarea-wrap { position: relative; min-width: 0; }
.tk-reminder-textarea-wrap textarea { display: block; width: 100%; min-height: 302px; padding: 14px 18px 43px; margin: 0; resize: vertical; border: 1px solid var(--line); border-radius: 8px; color: #4b605a; background: #f1f5f4; font: inherit; font-size: 18px; line-height: 1.65; }
.tk-reminder-textarea-wrap textarea:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
.tk-reminder-character-count { position: absolute; bottom: 12px; right: 18px; color: #5c7069; font-size: 18px; background: #f1f5f4; line-height: 1.3; }
.tk-reminder-content-field { margin-bottom: 0; }
.tk-reminder-history { min-width: 0; padding: 20px; border: 1px solid var(--line); border-radius: 8px; }
.tk-reminder-history h3 { margin: 0 0 18px; font-size: 21px; line-height: 1.5; font-weight: 600; }
.tk-reminder-history-count { display: flex; align-items: baseline; gap: 8px; margin: 0 0 28px; padding: 12px 16px; background: var(--mint); color: var(--green); border-radius: 6px; font-size: 18px; }
.tk-reminder-history-count strong { font-size: 27px; line-height: 1.2; font-weight: 650; }
.tk-reminder-timeline { list-style: none; padding: 0 0 0 20px; margin: 0; border-left: 2px solid #dce4e2; }
.tk-reminder-timeline li { position: relative; padding: 0 0 30px; }
.tk-reminder-timeline li:last-child { padding-bottom: 0; }
.tk-reminder-timeline li::before { content: ''; position: absolute; left: -27px; top: 7px; width: 12px; height: 12px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 4px #fff; }
.tk-reminder-timeline time { display: block; margin-bottom: 18px; color: #4b605a; font-size: 18px; font-variant-numeric: tabular-nums; }
.tk-reminder-timeline dl { margin: 0; }
.tk-reminder-timeline dl > div { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; margin: 8px 0; font-size: 18px; line-height: 1.7; color: #5c7069; }
.tk-reminder-timeline dd { margin: 0; white-space: pre-line; overflow-wrap: anywhere; }
.tk-reminder-history-empty { margin: 0; font-size: 18px; color: var(--muted); }
.tk-reminder-footer { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 18px 28px 22px; border-top: 1px solid #e3eae7; background: var(--surface); flex-shrink: 0; }
.tk-reminder-footer-copy { min-width: 0; }
.tk-reminder-footer-copy p { margin: 8px 0 0; font-size: 18px; color: var(--muted); line-height: 1.5; }
.tk-reminder-record-info { display: inline-flex; flex-shrink: 0; color: #5c7069; }
.tk-reminder-record-info .icon { width: 19px; height: 19px; }
.tk-reminder-actions { display: flex; align-items: center; gap: 14px; flex-shrink: 0; }
.tk-reminder-actions .button { min-height: 48px; min-width: 128px; border-radius: 6px; font-size: 18px; }
.tk-reminder-dialog button:focus-visible,.tk-reminder-dialog input:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }

@media (max-width: 1080px) {
  .tk-reminder-dialog--history .tk-reminder-columns { grid-template-columns: minmax(0, 1fr); }
  .tk-reminder-field { grid-template-columns: 145px minmax(0, 1fr); }
}

@media (max-width: 700px) {
  .tk-reminder-dialog,.tk-reminder-dialog--history { width: calc(100vw - 24px); max-height: calc(100dvh - 24px); }
  .tk-reminder-header { padding: 18px 18px 12px; }
  .tk-reminder-body { padding: 8px 18px 18px; }
  .tk-reminder-material-content { padding: 16px; }
  .tk-reminder-material-facts { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
  .tk-reminder-material-facts > div { border-left: 0; padding: 0; }
  .tk-reminder-field { grid-template-columns: minmax(0, 1fr); gap: 12px; margin-top: 24px; }
  .tk-reminder-recipients > div { padding-right: 10px; padding-left: 18px; }
  .tk-reminder-footer { align-items: stretch; flex-direction: column; padding: 16px 18px 18px; gap: 16px; }
  .tk-reminder-actions { justify-content: flex-end; }
  .tk-reminder-check { align-items: flex-start; }
  .tk-reminder-check input { margin-top: 3px; }
}

@media (max-width: 400px) {
  .tk-reminder-actions .button { min-width: 0; flex: 1; }
  .tk-reminder-actions { width: 100%; }
  .tk-reminder-material-identity { gap: 12px; }
  .tk-reminder-material-identity img { width: 76px; height: 66px; }
  .tk-reminder-timeline dl > div { grid-template-columns: minmax(0, 1fr); gap: 0; }
}

et))closeInfo();\n      if(!fields.contains(event.target)&&!fieldsButton.contains(event.target))closeFields();\n      const sortButton=event.target.closest('[data-sort]');\n      if(sortButton){const key=sortButton.dataset.sort;const asc=sortState?.key===key?!sortState.asc:false;sortState={key,asc};rows.sort((a,b)=>{const av=sortValue(a,key);const bv=sortValue(b,key);if(Number.isNaN(av)&&Number.isNaN(bv))return 0;if(Number.isNaN(av))return 1;if(Number.isNaN(bv))return -1;return asc?av-bv:bv-av});const sortSelect=document.getElementById('gmv-sort');sortSelect.value='custom';sortSelect.dispatchEvent(new Event('change',{bubbles:true}));renderTable();}\n      if(event.target.closest('.local-nav'))notify('此 HTML 仅展示产品广告页的视觉预览。');\n    });\n    document.addEventListener('keydown',event=>{if(event.key==='Escape'){const wasOpen=!fields.hidden;closeInfo();closeFields();if(wasOpen)fieldsButton.focus();}});\n    document.getElementById('table-viewport').addEventListener('scroll',closeInfo);\n    window.addEventListener('resize',closeInfo);\n    document.getElementById('collapse-sidebar').addEventListener('click',()=>{const collapsed=document.body.classList.toggle('sidebar-collapsed');document.getElementById('collapse-sidebar').setAttribute('aria-expanded',String(!collapsed));document.getElementById('collapse-sidebar').setAttribute('aria-label',collapsed?'展开侧边栏':'收起侧边栏');});\n    document.getElementById('ads-menu').addEventListener('click',()=>{const subnav=document.getElementById('ads-subnav');subnav.hidden=!subnav.hidden;document.getElementById('ads-menu').setAttribute('aria-expanded',String(!subnav.hidden));});\n    document.getElementById('filters').addEventListener('submit',event=>{event.preventDefault();notify('视觉预览保留当前页面快照；其他日期和筛选结果需在原系统查询。');});\n    document.getElementById('filters').addEventListener('reset',()=>{rows=[...snapshot.rows];sortState=null;renderTable();});\n  \u003c/script>\n  \u003cscript>\n/* Visual enhancement only: native selects remain the form and value source. */\n(() => {\n  'use strict';\n  let opened = null;\n  const close = (restoreFocus = false) => {\n    if (!opened) return;\n    const widget = opened;\n    opened = null;\n    widget.panel.hidden = true;\n    widget.trigger.setAttribute('aria-expanded', 'false');\n    widget.trigger.removeAttribute('aria-activedescendant');\n    widget.trigger.classList.remove('is-open');\n    if (restoreFocus) widget.trigger.focus();\n  };\n\n  function enhance(select) {\n    const label = select.labels[0];\n    const wrapper = document.createElement('div');\n    wrapper.className = 'tk-select';\n    select.before(wrapper);\n    wrapper.append(select);\n    const trigger = document.createElement('button');\n    trigger.type = 'button';\n    trigger.className = 'tk-select-trigger';\n    trigger.id = `${select.id}-trigger`;\n    trigger.setAttribute('role', 'combobox');\n    trigger.setAttribute('aria-haspopup', 'listbox');\n    trigger.setAttribute('aria-expanded', 'false');\n    trigger.setAttribute('aria-controls', `${select.id}-listbox`);\n    trigger.innerHTML = '\u003cspan class=\"tk-select-value\">\u003c/span>\u003csvg class=\"tk-select-chevron\" viewBox=\"0 0 16 16\" aria-hidden=\"true\">\u003cpath d=\"m4 6 4 4 4-4\"/>\u003c/svg>';\n    const value = trigger.querySelector('.tk-select-value');\n    value.id = `${select.id}-value`;\n    if (label) {\n      label.id ||= `${select.id}-label`;\n      trigger.setAttribute('aria-labelledby', `${label.id} ${value.id}`);\n      label.addEventListener('click', event => {\n        event.preventDefault();\n        trigger.focus();\n      });\n    } else {\n      trigger.setAttribute('aria-label', select.getAttribute('aria-label') || select.name);\n    }\n    wrapper.append(trigger);\n    const panel = document.createElement('div');\n    panel.className = 'tk-select-menu';\n    panel.id = `${select.id}-listbox`;\n    panel.setAttribute('role', 'listbox');\n    if (label) panel.setAttribute('aria-labelledby', label.id);\n    pa     const search = String(values.get('search') || '').trim().toLocaleLowerCase();
    visibleRows = rows.filter(row => {
      const searchable = [row.creatorName, row.creatorDescription, row.productPid, row.productName, row.workId || ''].join(' ').toLocaleLowerCase();
      return (!search || searchable.includes(search)) &&
        (!values.get('owner') || row.bdOwner === values.get('owner')) &&
        (!values.get('authorization') || row.authorizationStatus === values.get('authorization')) &&

    event.preventDefault();
    query();
  }

  function onReset() {

  function onChange(event) {

      syncSelection();
    }
  }

  function exportRows() {
    const headers = ['达人', '素材', '关联产品PID', '产品名称', '分类', '发布日期', '未授权天数', ...(view.organicColumn ? ['自然流出单数'] : []), '授权状态', '提醒状态', 'BD负责人', '风险等级', '建议动作'];
    const csvCell = value => `"${String(value ?? '').replace(/"/g, '""')}"`;
    const lines = [headers, ...visibleRows.map(row => [row.creatorName, row.creatorDescription, row.productPid, row.productName, row.category, row.publishedDate, row.unauthorizedDays, ...(view.organicColumn ? [row.organicOrders] : []), row.authorizationStatus, row.reminderStatus, row.bdOwner, row.risk, row.suggestedAction])];
    const csv = '\uFEFF' + lines.map(line => line.map(csvCell).join(',')).join('\r\n');
    const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' }));
    const link = document.createElement('a');
    link.href = url;
    link.download = `达人素材授权提醒${view.organicColumn ? '-自然流出单数' : ''}.csv`;
    link.click();
    setTimeout(() => URL.revokeObjectURL(url), 0);
    notify?.(`已导出当前列表的${visibleRows.length}条快照记录`);
  }

  function onClick(event) {
    const remindButton = event.target.closest('[data-remind]');
    if (remindButton) {
      const row = rows.find(item => item.id === remindButton.dataset.remind);
      if (row?.canRemind) onRemind?.({ ...row }, row.reminderCount === 0 ? 'first' : 'history');
    } else if (event.target.closest('.reminder-export')) {
      exportRows();
    }
  }

  form.addEventListener('submit', onSubmit);
  form.addEventListener('reset', onReset);
  element.addEventListener('change', onChange);
  element.addEventListener('click', onClick);
  renderRows();

  return {
    element,
    cleanup() {
      form.removeEventListener('submit', onSubmit);
      form.removeEventListener('reset', onReset);
      element.removeEventListener('change', onChange);
      element.removeEventListener('click', onClick);
    }
  };
}

return {renderReminders};
})();

        { time: '2026-10-05 11:03', recipient: '李四', role: '运营负责人', status: '跟进中' },
      ],
    });
  }
  return result;
}

function showReminder(row, mode) {
  currentDialog?.close();
  const dialog = ReminderDialogModule.openReminderDialog({
    row: dialogRow(row), mode, icon, escapeHtml, assetUrl, notify,
    onClose: () => { if (currentDialog === dialog) currentDialog = null; },
  });
  currentDialog = dialog;
}

function renderScreen() {
  const requested = location.hash.slice(1) || document.body.dataset.initialView;
  const view = Object.hasOwn(views, requested) ? requested : 'heating';
  currentDialog?.close();
  currentScreen?.cleanup();
  document.body.classList.toggle('product-data-view', view === 'product-data' || view === 'products');
  const content = document.getElementById('screen-content');
  document.getElementById('current-page-label').textContent = views[view];
  document.title = `${views[view]} · TK 广告预览`;
  document.querySelectorAll('[data-view]').forEach(link => {
    const active = link.dataset.view === view || (link.closest('.subnav')
      && link.dataset.view === 'reminders' && !['heating', 'products', 'product-data'].includes(view));
    link.classList.toggle('current', active);
    if (active) link.setAttribute('aria-current', 'page');
    else link.removeAttribute('aria-current');
  });
  if (view === 'product-data' || view === 'products') {
    const frame = document.createElement('iframe');
    frame.className = 'product-background';
    frame.title = '原产品广告视觉预览';
    frame.srcdoc = productBackground;
    content.replaceChildren(frame);
    currentScreen = { element: frame, cleanup() { frame.remove(); } };
    if (view === 'product-data') {
      const dialog = ProductDataModule.openProductData({
        data: data['product-data'], icon, escapeHtml, assetUrl, notify,
        onClose: () => {
          if (currentDialog === dialog) currentDialog = null;
          if (location.hash === '#product-data') location.hash = '#products';
        },
      });
      currentDialog = dialog;
    }
  } else if (view === 'heating') {
    currentScreen = HeatingModule.renderHeating({ data: data.heating, icon, escapeHtml, assetUrl, notify });
    content.replaceChildren(currentScreen.element);
  } else {
    const screen = RemindersModule.renderReminders({
      data: data.reminders, variant: view === 'organic' ? 'organic' : 'standard',
      icon, escapeHtml, assetUrl, notify, onRemind: showReminder,
    });
    content.replaceChildren(screen.element);
    const removeSelects = SelectModule.enhanceSelects(screen.element);
    currentScreen = { element: screen.element, cleanup() { removeSelects(); screen.cleanup(); } };
    if (view === 'first-reminder' || view === 'second-reminder') {
      showReminder(data.reminders.rows[0], view === 'first-reminder' ? 'first' : 'history');
    }
  }
}

document.getElementById('collapse-sidebar').addEventListener('click', event => {
  const collapsed = document.body.classList.toggle('sidebar-collapsed');
  event.currentTarget.setAttribute('aria-expanded', String(!collapsed));
  event.currentTarget.setAttribute('aria-label', collapsed ? '展开侧边栏' : '收起侧边栏');
});
document.getElementById('ads-menu').addEventListener('click', event => {
  const subnav = document.getElementById('ads-subnav');
  subnav.hidden = !subnav.hidden;
  event.currentTarget.setAttribute('aria-expanded', String(!subnav.hidden));
});
document.querySelectorAll('.local-nav').forEach(button => button.addEventListener('click', () => {
  notify('此预览仅包含已提供的广告界面。');
}));
document.addEventListener('click', event => {
  const link = event.target.closest('a[data-view]');
  if (link && location.hash === link.hash) { event.preventDefault(); renderScreen(); }
});
window.addEventListener('hashchange', renderScreen);
renderScreen();
</script>
