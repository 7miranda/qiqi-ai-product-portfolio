<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CROSSBOUND · 定价财务室</title><link rel="icon" href="data:,"><link rel="stylesheet" href="./fonts.css?v=c369fae2d3"><link rel="stylesheet" href="./style.css?v=d448354594"><link rel="stylesheet" href="./typography.css?v=aeccc9c5aa"><link rel="stylesheet" href="./integration.css?v=b6a982937b"></head><body>
<div id="world" aria-label="固定视角的三维定价财务室"></div><div class="vignette"></div>
<header><button id="exit" class="back" aria-label="返回园区">← 园区</button><div class="scene-heading"><span class="scene-code">W2 · PRICING &amp; FINANCE</span><h1>定价财务室</h1></div><div class="head-right"><span class="round">正在读取经营进度</span><div class="cash"><small>经营现金</small><strong id="cash">—</strong></div><button id="help" class="square" aria-label="操作说明">?</button></div></header>
<aside id="panel"><div class="panel-head"><div class="room-heading"><h2>采购与定价</h2><span id="room-status">03 / 07</span></div><p id="context"></p><p id="supplier"></p></div><div class="panel-body">
<div class="section-title"><span>01</span> 选备货方案 <small>沿用洽谈结果</small></div><div class="plans"></div>
<div class="section-title"><span>02</span> 定售价 · 定备货</div>
<div class="input-head"><label for="price">单件售价</label><div class="stepper price-stepper"><button data-step="price:-1" aria-label="售价减少1美元">−</button><output id="price-value">—</output><button data-step="price:1" aria-label="售价增加1美元">＋</button></div></div>
<div class="slider" id="price-slider"><div class="slider-rail"></div><div class="danger-zone"></div><div class="slider-fill"></div><span class="slider-marker price-reference" aria-hidden="true"></span><input type="range" id="price" aria-label="单件售价" min="0" max="1" step="1" value="0"></div><div class="range-label price-labels"></div>
<div class="input-head stock-head"><label for="qty">备货数量 <small id="stock-count">目标库存</small></label><div class="stepper qty-stepper"><button data-step="qty:-100" aria-label="备货减少100件">−</button><output id="qty-value">—</output><button data-step="qty:100" aria-label="备货增加100件">＋</button></div></div>
<div class="slider qty-slider" id="qty-slider"><div class="slider-rail"></div><div class="slider-fill"></div><span class="slider-marker" id="demand-marker" aria-hidden="true"></span><input type="range" id="qty" aria-label="备货数量" min="200" max="1600" step="100" value="400"></div><div class="range-label"><span id="qty-min"></span><span id="demand-label"></span></div>
<div class="section-title cost-heading"><span>03</span> 本轮成本预估 <b id="cost-total"></b><button id="detail-toggle" aria-expanded="false">明细 ＋</button></div><div id="cost-block" hidden><div class="cost-overview"><div><i class="dot brass"></i>销售货值与损耗<b id="cost-product"></b></div><div><i class="dot cyan"></i>物流与税费 <small>预估</small><b id="cost-logistics"></b></div><div><i class="dot violet"></i>平台与售后 <small>预估</small><b id="cost-selling"></b></div></div><div id="details"></div><div class="unit-profit"><span>本轮贡献利润</span><strong id="unit-profit"></strong></div></div>
</div><div class="panel-foot"><p class="risk" id="risk" role="status"></p><div class="forecast"><div><small>本轮预计贡献利润 <button id="explain" aria-label="查看成本与利润明细">明细 ↗</button></small><strong id="profit"></strong></div><div class="sell"><small>预计售出</small><b id="sold"></b></div></div><button class="primary" id="purchase"><span>确认采购</span><b id="pay"></b><span>→</span></button><div class="footnote" id="payment-note"></div><button id="funding" class="text-button">查看资金安排 ↗</button></div></aside>
<footer class="journey"><span>✓ 选品与供货洽谈</span><i></i><b>03 定价财务室</b><i></i><span>04 商品页工作室</span><i></i><span>05 推广室</span><i></i><span>06 物流仓</span><i></i><span>07 财报</span></footer>
<dialog id="dialog"><button class="close" id="close" aria-label="关闭弹窗">×</button><div id="dialog-content"></div></dialog><div id="toast" role="status"></div><div id="loading"><div class="eyebrow">CROSSBOUND / W2</div><b>定价财务室</b><span>正在同步本轮采购信息…</span></div>
