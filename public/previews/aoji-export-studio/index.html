<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#ffffff">
  <title>傲基出海工作室</title>
  <style>
:root {
  color-scheme: light;
  --primary: #366fd2;
  --primary-hover: #275bb8;
  --primary-soft: #eff5ff;
  --ink: #172431;
  --text: #4d5d6e;
  --muted: #647487;
  --line: #e8edf4;
  --page: #fafcff;
  --white: #ffffff;
  --green: #397d6b;
  --amber: #98712c;
  --radius: 18px;
  --shadow: 0 20px 64px rgba(37, 58, 91, .055), 0 2px 7px rgba(37, 58, 91, .018);
}
* { box-sizing: border-box; }
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
body { font: 14px/1.6 -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif; color: var(--ink); background: var(--page); -webkit-font-smoothing: antialiased; }
button, input, textarea, select { font: inherit; }
button { cursor: pointer; color: inherit; border: 0; background: none; transition: background .18s, color .18s, box-shadow .18s, transform .18s; touch-action: manipulation; }
button:disabled { cursor: not-allowed; opacity: .45; }
button:active:not(:disabled) { transform: translateY(1px); }
button, a, input, textarea, select { -webkit-tap-highlight-color: transparent; }
button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 3px solid #81a7e5; outline-offset: 3px; }
[hidden] { display: none !important; }
.icon { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; vertical-align: middle; flex-shrink: 0; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; }
.skip-link { position: fixed; top: 8px; left: 50%; z-index: 250; padding: 8px 15px; border-radius: 8px; background: var(--ink); color: white; transform: translate(-50%, -150%); }
.skip-link:focus { transform: translate(-50%, 0); }
.desktop-app { height: 100%; display: grid; grid-template-columns: 76px minmax(0, 1fr); grid-template-rows: 38px minmax(0, 1fr); background: #fff; }
.window-chrome { grid-column: 1/-1; height: 38px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 27px 0 100px; background: #fff; -webkit-app-region: drag; user-select: none; color: var(--muted); }
.window-brand, .window-local { font: 11px/1.4 ui-monospace, "SFMono-Regular", monospace; letter-spacing: 2px; color: #6a7b90; }
.window-brand { font-weight: 600; letter-spacing: 3px; color: #344557; }
.window-subtitle { font-size: 11px; color: #6b7a8b; letter-spacing: 1px; }
.window-local { text-align: right; font-size: 11px; letter-spacing: 1.7px; }
.rail { grid-row: 2; display: flex; flex-direction: column; align-items: center; padding: 25px 7px 17px; background: #fff; gap: 36px; box-shadow: 6px 0 30px rgba(50, 70, 100, .018); z-index: 2; }
.app-emblem { width: 38px; height: 38px; color: #233b59; display: grid; place-items: center; }
.app-emblem svg { width: 32px; height: 32px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linejoin: round; }
.rail nav, .rail-bottom { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 11px; }
.rail-bottom { margin-top: auto; }
.rail-button { width: 60px; min-height: 62px; padding-inline: 0; border-radius: 15px; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 5px; color: var(--muted); position: relative; font-size: 12px; }
.rail-button > span:not([data-icon]) { white-space: nowrap; }
.rail-button .icon { width: 22px; height: 22px; }
.rail-button:hover { background: #f7f9fc; color: var(--ink); }
.rail-button.selected { color: #253d5f; background: linear-gradient(145deg, #f6f9fd, #edf2f9); box-shadow: inset 0 1px 0 #fff, 0 4px 12px rgba(43, 65, 96, .04); font-weight: 550; }
.rail-button.selected::after { content: ''; position: absolute; left: -7px; top: 23px; bottom: 23px; width: 2px; border-radius: 2px; background: var(--primary); }
.rail-count { position: absolute; right: 7px; top: 5px; background: var(--primary); color: #fff; border-radius: 10px; font-style: normal; line-height: 16px; min-width: 16px; font-size: 11px; }
.rail-profile { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 12px; background: #f0f4f9; color: #405c80; font-size: 13px; margin-top: 6px; box-shadow: inset 0 1px 0 #fff; }
.workspace { grid-row: 2; min-width: 0; min-height: 0; display: flex; flex-direction: column; background: radial-gradient(ellipse at 20% 100%, #f0f6ff 0, transparent 50%), #fafcff; }
.workspace-bar { height: 72px; flex-shrink: 0; padding: 0 31px; display: flex; align-items: center; justify-content: space-between; gap: 16px; background: rgba(255, 255, 255, .88); }
.company-switch, .workspace-controls { display: flex; align-items: center; gap: 14px; min-width: 0; }
.company-mark { width: 33px; height: 33px; background: linear-gradient(140deg, #fbfcff, #edf2f8); border-radius: 11px; display: grid; place-items: center; color: #6582a7; box-shadow: inset 0 1px 0 #fff, 0 2px 6px rgba(40, 60, 90, .035); }
.company-mark .icon { width: 19px; height: 19px; }
.company-switch button { padding: 7px 0; font-weight: 550; max-width: 230px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tiny-chevron { color: var(--muted); margin-left: 8px; }
.workspace-divider { height: 15px; width: 1px; background: #dfe9f6; margin: 0 3px; }
#workspaceLabel { font-size: 13px; color: var(--muted); }
.local-signal { font-size: 11px; display: flex; align-items: center; gap: 6px; color: var(--muted); padding: 5px 9px; border-radius: 7px; }
.local-signal:hover { background: #f4f7fb; color: var(--ink); }
.local-signal i, .composer-status i { width: 5px; height: 5px; background: #73b8a9; border-radius: 50%; display: inline-block; }
.role-switch { display: flex; align-items: center; gap: 9px; font-size: 12px; color: var(--text); padding: 8px 0 8px 14px; }
.role-switch .icon { width: 14px; height: 14px; }
.workspace-body { display: grid; grid-template-columns: minmax(470px, 1.17fr) minmax(390px, 1fr); gap: 19px; padding: 20px 23px 23px; min-height: 0; flex: 1; overflow: hidden; }
.followup, .main-pane { min-width: 0; min-height: 0; background: #fff; border-radius: 22px; box-shadow: var(--shadow); overflow: hidden; }
.followup { display: flex; flex-direction: column; }
.followup-head { height: 88px; padding: 22px 28px 15px; display: flex; align-items: center; gap: 13px; flex-shrink: 0; }
.followup-head > div { min-width: 0; flex: 1; }
.panel-kicker { display: block; color: #65788e; font-size: 11px; line-height: 1.6; letter-spacing: 1px; margin-bottom: 6px; }
.followup-head h2 { font-size: 21px; font-weight: 550; margin: 0; color: var(--ink); letter-spacing: -.6px; line-height: 1.45; }
.followup-close { display: none !important; }
.text-button { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: #58728f; padding: 7px 0; }
.text-button .icon { width: 14px; height: 14px; }
.text-button:hover { color: var(--primary-hover); }
.new-project-button { align-self: center; font-size: 11px; white-space: nowrap; padding: 8px 10px; border-radius: 8px; background: #f5f9ff; }
.new-project-button .icon { width: 14px; height: 14px; }
.new-project-button:hover { background: var(--primary-soft); }
.icon-button { width: 34px; height: 34px; display: inline-grid; place-items: center; flex-shrink: 0; color: #5e7898; border-radius: 10px; }
.icon-button:hover { background: var(--primary-soft); color: var(--primary); }
.icon-button .icon { width: 18px; height: 18px; }
.followup-scroll { padding: 8px 28px 22px; overflow-y: auto; overscroll-behavior: contain; flex: 1; min-height: 0; scrollbar-width: thin; scrollbar-color: #dce8f8 transparent; }
.team-assurance { color: var(--text); font-size: 13px; line-height: 1.9; padding: 10px 0 14px; }
.team-assurance strong { display: block; color: var(--ink); font-size: 17px; font-weight: 500; line-height: 1.7; letter-spacing: -.3px; margin-bottom: 7px; max-width: 450px; }
.team-assurance p { margin: 0; font-size: 14px; color: var(--text); max-width: 490px; }
.desktop-app[data-surface="work"] .team-assurance { display: none; }
.followup-section { padding: 17px 0 0; }
.followup-section:empty { display: none; }
.section-label { font-size: 12px; color: var(--text); margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; font-weight: 500; letter-spacing: .1px; }
.section-label button { font-size: 11px; color: var(--primary); padding: 0; }
.summary-goal { font-size: 14px; color: var(--ink); line-height: 1.8; margin: 0 0 10px; overflow-wrap: anywhere; }
.summary-meta { display: flex; gap: 6px; flex-wrap: wrap; }
.summary-meta span { font-size: 11px; color: #5a6e85; background: #fff; padding: 4px 9px; border-radius: 6px; }
#currentWorkSummary { padding: 18px 20px; margin: 7px 0 10px; border-radius: 15px; background: linear-gradient(120deg, #f4f7fb, #fafcff); }
#currentWorkSummary > .section-label { font-size: 11px; color: #687b91; }
#followupAssignments { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; }
#followupAssignments > .section-label { grid-column: 1/-1; margin: 0 0 1px; }
.assignment { display: flex; gap: 8px; padding: 13px; align-items: flex-start; border-radius: 13px; background: #f9fbfe; box-shadow: none; min-width: 0; }
.assignment > .mini-portrait { width: 27px; height: 27px; flex: 0 0 27px; }
.assignment > div:not(.mini-portrait) { min-width: 0; flex: 1; }
.assignment strong { display: flex; flex-wrap: wrap; gap: 2px 9px; font-size: 12px; color: var(--ink); font-weight: 550; line-height: 1.5; }
.assignment strong > span { font-size: 11px; font-weight: 400; color: var(--muted); }
.assignment p { font-size: 12px; color: var(--text); line-height: 1.75; margin: 5px 0 0; }
.assignment button { font-size: 11px; color: var(--primary-hover); padding: 0; text-align: left; margin-top: 5px; }
.result-link { width: 100%; padding: 15px 16px; margin-bottom: 9px; border-radius: 13px; background: #fff; box-shadow: 0 5px 24px rgba(40, 65, 100, .065), inset 0 0 0 1px #f1f4f8; display: flex; align-items: flex-start; gap: 10px; text-align: left; font-size: 13px; color: var(--ink); line-height: 1.7; }
.result-link > .icon { width: 16px; height: 16px; margin-top: 3px; color: var(--primary); }
.result-link:hover { background: #fafdff; color: var(--primary-hover); box-shadow: 0 8px 26px rgba(40, 65, 100, .1), inset 0 0 0 1px #e5edf8; }
.result-link small { display: block; font-size: 11px; color: var(--muted); margin-top: 2px; }
.trail-step { display: flex; align-items: flex-start; gap: 8px; text-align: left; width: 100%; font-size: 11px; line-height: 1.8; padding: 7px 0; color: var(--muted); }
.trail-step > i { width: 19px; height: 19px; background: #eef5ff; color: var(--primary); border-radius: 7px; font-size: 11px; display: grid; place-items: center; font-style: normal; flex-shrink: 0; margin-top: 1px; }
.trail-step strong { display: block; font-size: 11px; font-weight: 500; color: var(--text); }
.trail-step.active > i { background: #e5f0ff; }
.trail-step.interrupted > i, .trail-step.blocked > i { background: #fff5e5; color: var(--amber); }
.next-item { font-size: 13px; padding: 14px 16px; margin-bottom: 8px; border-radius: 12px; background: #f1f6ff; color: var(--ink); }
.next-item p { font-size: 12px; color: var(--text); margin: 4px 0 5px; line-height: 1.8; }
.next-item button { font-size: 11px; color: var(--primary-hover); padding: 0; }
.followup-method { display: flex; gap: 10px; padding: 18px 0 0; }
.followup-method > span .icon { width: 18px; height: 18px; color: #7293bb; margin-top: 3px; }
.followup-method strong { font-size: 12px; font-weight: 500; color: var(--text); }
.followup-method p { font-size: 11px; color: var(--muted); line-height: 1.8; margin: 4px 0 0; }
.followup-method .text-button { font-size: 11px; color: var(--primary-hover); padding-block: 4px; }
.work-list { padding: 18px 21px 12px; flex-shrink: 0; background: linear-gradient(180deg, #fff, #fafcff); box-shadow: 0 -8px 32px rgba(50, 78, 113, .025); }
.list-heading { display: flex; align-items: center; justify-content: space-between; padding: 0 6px; margin-bottom: 12px; gap: 8px; }
.list-heading strong { font-size: 12px; font-weight: 500; color: var(--text); }
.list-heading > span { font-size: 11px; color: var(--muted); }
.crew-list { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 7px; }
.crew-member { display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 5px; text-align: center; min-width: 0; padding: 11px 2px 9px; border-radius: 14px; position: relative; }
.crew-member:hover { background: #f5f9ff; box-shadow: 0 5px 22px rgba(78, 128, 200, .05); }
.crew-member.selected { background: linear-gradient(145deg, #f8fbff, #edf3fd); box-shadow: inset 0 1px 0 #fff, 0 5px 18px rgba(55, 86, 132, .055); }
.crew-member strong { font-size: 12px; line-height: 1.5; color: var(--ink); font-weight: 500; white-space: nowrap; }
.crew-member small { display: block; font-size: 11px; color: var(--muted); line-height: 1.5; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.crew-status { height: 5px; margin-top: 2px; display: flex; align-items: center; font-size: 0; }
.crew-status i { width: 4px; height: 4px; border-radius: 50%; background: #b3c9e6; }
.crew-member.working .crew-status i { background: var(--primary); animation: pulse 1.7s infinite; }
.mini-portrait, .team-icon { width: 34px; height: 34px; display: inline-grid; place-items: center; flex-shrink: 0; background: transparent; color: #6a8fbd; }
.team-icon .icon, .team-icon svg { width: 23px; height: 23px; fill: none; stroke: currentColor; stroke-width: 1.45; stroke-linecap: round; stroke-linejoin: round; }
.avatar-image { width: 100%; height: 100%; display: block; object-fit: contain; }
.crew-member .mini-portrait, .crew-member .team-icon { width: 48px; height: 48px; margin-bottom: 3px; }
.crew-member .team-icon .icon { width: 30px; height: 30px; }
.project-footer { display: flex; align-items: center; gap: 9px; padding: 12px 6px 0; min-height: 40px; }
.project-footer-label { font-size: 11px; color: var(--muted); white-space: nowrap; }
#workList { flex: 1; min-width: 0; }
.project-footer .icon-button { width: 26px; height: 26px; }
.project-footer .icon-button .icon { width: 14px; height: 14px; }
.work-thread { width: 100%; text-align: left; padding: 0; display: flex; align-items: center; gap: 10px; min-width: 0; }
.work-thread strong { display: block; color: var(--text); font-size: 11px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 58%; }
.work-thread span { font-size: 11px; color: var(--muted); white-space: nowrap; }
.work-empty { font-size: 11px; color: var(--muted); line-height: 1.7; }
.project-footer .work-empty br { display: none; }
.shared-work-stage { padding: 18px 0 10px; }
.shared-map-caption { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; color: var(--muted); font-size: 11px; line-height: 1.7; }
.shared-map-caption strong { color: var(--text); font-size: 12px; font-weight: 500; }
.shared-map-caption strong > span { color: #9cb4d1; margin-inline: 5px; }
.shared-map-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr) minmax(0, 1fr); gap: 13px; align-items: center; position: relative; isolation: isolate; }
.shared-map-grid::before { content: ''; position: absolute; height: 1px; background: linear-gradient(90deg, transparent, #ceddf2 22%, #ceddf2 78%, transparent); left: 18%; right: 18%; top: 50%; z-index: -1; }
.shared-node { min-height: 101px; padding: 13px 8px; background: linear-gradient(145deg, #fff, #f9fbfe); border-radius: 15px; box-shadow: 0 7px 24px rgba(40, 69, 108, .07), inset 0 1px 0 #fff; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 4px; text-align: center; color: var(--text); min-width: 0; }
button.shared-node:hover { background: #f5f9ff; box-shadow: 0 10px 30px rgba(77, 125, 187, .14); }
.shared-node .team-icon { width: 34px; height: 34px; margin-bottom: 2px; }
.shared-node strong { font-size: 12px; font-weight: 500; line-height: 1.5; display: block; color: var(--ink); }
.shared-node small { font-size: 11px; font-weight: 400; line-height: 1.6; display: block; color: var(--muted); }
.shared-branches { display: grid; gap: 10px; }
.shared-branches .shared-node { min-height: 63px; display: grid; grid-template-columns: 29px minmax(0, 1fr); grid-template-rows: auto auto; text-align: left; column-gap: 7px; padding: 10px; }
.shared-branches .shared-node .team-icon { grid-row: 1/3; width: 29px; height: 29px; margin: 0; }
.shared-branches .shared-node small { grid-column: 2; font-size: 11px; }
.shared-branches .shared-node strong { font-size: 11px; }
.shared-map-empty { margin: 0; }
.main-pane { background: #fff; }
.cabin, .conversation { height: 100%; min-height: 0; display: flex; flex-direction: column; }
.conversation-head { height: 88px; flex-shrink: 0; padding: 0 27px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.chat-person { display: flex; align-items: center; gap: 10px; min-width: 0; }
.chat-person .mini-portrait { width: 39px; height: 39px; }
.chat-person strong { font-size: 14px; font-weight: 550; color: var(--ink); display: block; line-height: 1.5; }
.chat-person > div > span { font-size: 11px; color: var(--muted); display: block; line-height: 1.7; }
.conversation-head-actions { display: flex; align-items: center; gap: 10px; }
.conversation-head-actions .text-button { font-size: 11px; white-space: nowrap; }
.conversation-head-actions .icon-button { width: 28px; height: 30px; }
.conversation-scroll { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 13px 32px 22px; scrollbar-width: thin; scrollbar-color: #dce8f8 transparent; min-height: 0; }
.welcome-note { padding: 26px 0 10px; max-width: 610px; margin: 0 auto; }
.welcome-kicker { font: 11px/1.8 ui-monospace, "SFMono-Regular", monospace; font-weight: 400; color: #617895; letter-spacing: 1px; margin-bottom: 22px; }
.welcome-note h2 { font-size: clamp(26px, 2.3vw, 36px); line-height: 1.6; letter-spacing: -.7px; font-weight: 500; margin: 0 0 22px; color: var(--ink); text-wrap: balance; }
.welcome-note p { font-size: 14px; color: var(--text); line-height: 2; max-width: 470px; margin: 0 0 16px; text-wrap: pretty; }
.welcome-prompt { margin-top: 26px; padding-top: 0; color: var(--muted); font-size: 12px; line-height: 1.9; }
.welcome-prompt strong { font-weight: 400; color: var(--muted); }
.conversation-composer { padding: 10px 23px 18px; flex-shrink: 0; background: #fff; }
.starter-actions { display: flex; flex-wrap: wrap; gap: 7px; margin: 0 0 11px; }
.starter-actions button { background: #f6faff; border-radius: 9px; padding: 8px 10px; display: inline-flex; align-items: center; justify-content: space-between; flex: 1; gap: 7px; font-size: 11px; color: #56759a; white-space: nowrap; }
.starter-actions button .icon { width: 12px; height: 12px; }
.starter-actions button:hover { background: #eaf3ff; color: var(--primary-hover); }
#chatForm { border: 1px solid #e4ebf5; border-radius: 17px; background: #fff; box-shadow: 0 8px 28px rgba(46, 76, 121, .055); padding: 15px 16px 13px; transition: border-color .18s, box-shadow .18s; }
#chatForm:focus-within { border-color: #96b5e5; box-shadow: 0 8px 30px rgba(46, 99, 177, .1); }
#chatInput { width: 100%; height: 59px; min-height: 48px; max-height: 130px; resize: vertical; border: 0; outline: 0; box-shadow: none; background: transparent; font-size: 14px; color: var(--ink); line-height: 1.8; padding: 0; }
#chatInput::placeholder { color: #6d7d91; }
.composer-tools, .composer-tools > div { display: flex; align-items: center; gap: 10px; }
.composer-tools { justify-content: space-between; gap: 12px; margin-top: 4px; }
.composer-tool { display: grid; place-items: center; width: 28px; height: 30px; color: #617c9d; padding: 3px; border-radius: 7px; }
.composer-tool .icon { width: 18px; height: 18px; }
.composer-tool:hover { background: #f0f6ff; color: var(--primary); }
.composer-hint { font-size: 11px; color: var(--muted); margin-left: 4px; }
.send-button { display: grid; place-items: center; width: 35px; height: 35px; border-radius: 10px; background: #22374e; color: #fff; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .14), 0 5px 14px rgba(35, 60, 92, .14); }
.send-button .icon { width: 18px; height: 18px; }
.send-button:hover:not(:disabled) { background: var(--primary-hover); box-shadow: 0 5px 18px rgba(65, 119, 207, .28); }
.composer-status { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 11px; color: var(--muted); padding: 9px 2px 0; }
.composer-status > span:first-child { display: flex; align-items: center; gap: 6px; }
.context-pill { display: flex; align-items: center; gap: 6px; max-width: 100%; padding: 7px 9px; margin-bottom: 8px; background: #f0f6ff; border-radius: 8px; color: var(--text); font-size: 11px; }
.context-pill .icon { width: 13px; height: 13px; }
.context-pill > span:nth-child(2) { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.context-pill button { margin-left: auto; color: var(--muted); font-size: 16px; line-height: 1; }
.message { margin: 0 0 26px; animation: appear .25s ease-out; }
.message-author { font-weight: 550; font-size: 13px; display: flex; align-items: center; gap: 8px; margin-bottom: 9px; color: var(--ink); }
.message-author .mini-portrait { width: 27px; height: 27px; margin-right: 1px; }

.factory-peek-progress progress{display:block;appearance:none;width:100%;height:4px;overflow:hidden;border:0;border-radius:5px;background:#ffffff14}.factory-peek-progress progress::-webkit-progress-bar{background:#ffffff14;border-radius:5px}.factory-peek-progress progress::-webkit-progress-value{border-radius:5px;background:#96d2c5}.factory-peek-progress progress::-moz-progress-bar{border-radius:5px;background:#96d2c5}
.factory-expert-tooltip>button{display:flex;align-items:center;justify-content:space-between;min-height:44px;width:100%;padding:10px 13px;border-radius:12px;background:#e8eef8;color:#24334b;font-size:12px}.factory-expert-tooltip>button:hover{background:#fff}.factory-expert-tooltip>button:focus-visible{outline:2px solid #97bfff;outline-offset:3px}

.factory-chat-welcome{flex:0 0 auto;text-align:left;padding:18px 28px 10px}.factory-chat-welcome h2{font-size:22px;font-weight:550;color:#2a405b;margin:0 0 9px}.factory-chat-welcome p{margin:0;font-size:12px;color:#6a809b}
.desktop-app #factoryChatPortal .conversation-scroll{min-height:0;flex:1 1 0;overflow:auto;padding:12px 24px}

.desktop-app #factoryChatPortal .companion-start{margin:0;padding:6px 0}.desktop-app #factoryChatPortal .companion-choices{display:flex;flex-wrap:wrap;gap:8px}.desktop-app #factoryChatPortal .companion-choice{min-height:44px;padding:9px 13px}
.factory-chat-close{display:inline-flex;align-items:center;justify-content:center;gap:5px;min-width:55px;min-height:36px;padding:8px 10px;border-radius:11px;background:#f0f4fa;color:#4a6a92;font-size:12px}
.desktop-app[data-chat-mode] .modal-layer{z-index:220}
@media(max-height:790px){.factory-expert-dock{padding-block:9px 6px}.factory-expert-seats{gap:1px}.factory-expert-seat{min-height:44px;gap:2px;padding-block:1px}.factory-master-seat{min-height:52px;margin-bottom:8px}.factory-chat-landing{padding-block:25px}.factory-team-summary{margin-top:22px}}

<body>
<a class="skip-link" href="#chatInput">跳到工作对话</a>
<div class="desktop-app" id="app">
  <div class="window-chrome"><span class="window-brand">AUKEY</span><span class="window-subtitle">工厂出海 · 专家团队</span><span class="window-local">出海工作室</span></div>
  <aside class="rail" aria-label="应用导航">
    <div class="app-emblem" aria-label="傲基"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="m16 4 12 7v14l-12 7-12-7V11zm0 0v14m-12-7 12 7 12-7M16 18v14"/></svg></div>
    <nav>
      <button class="rail-button selected" data-view="cabin" aria-label="出海工作室" title="出海工作室"><span data-icon="cabin"></span><span>工作室</span></button>
      <button class="rail-button" data-view="artifacts" aria-label="工作成果" title="工作成果"><span data-icon="layers"></span><span>成果</span><i id="artifactCount" class="rail-count" hidden></i></button>
      <button class="rail-button" data-view="memory" aria-label="工厂资料" title="工厂资料"><span data-icon="memory"></span><span>工厂资料</span></button>
    </nav>
    <div class="rail-bottom">
      <button class="rail-button" data-action="capabilities" aria-label="看看团队能帮什么"><span data-icon="spark"></span><span>能帮什么</span></button>
      <button class="rail-button" data-action="settings" aria-label="工厂与账号设置"><span data-icon="settings"></span><span>设置</span></button>
      <div class="rail-profile" id="railProfile">企</div>
    </div>
  </aside>
  <main class="workspace">
    <header class="workspace-bar">
      <div class="company-switch"><span class="company-mark" data-icon="building"></span><button data-action="settings" id="companyName">我的工厂 <span class="tiny-chevron">⌄</span></button><span class="workspace-divider"></span><span id="workspaceLabel">出海工作室</span></div>
      <div class="workspace-controls"><span class="edition-badge" id="editionBadge" hidden></span><button class="local-signal" data-action="help" aria-label="了解演示版说明" title="演示版说明"><i></i>演示版</button><button class="role-switch" data-action="role" id="roleButton">企业负责人 <span data-icon="chevron"></span></button></div>
    </header>
    <div class="workspace-body">
      <aside class="followup" id="followupPanel" aria-label="项目与团队协作">
        <header class="followup-head">
          <div><span class="panel-kicker">为这件事，一起出主意</span><h2 id="followupTitle">您的出海专家团队</h2></div>
          <button class="text-button new-project-button" data-action="newConversation"><span data-icon="compose"></span>新工作</button>
          <button class="icon-button followup-close" data-action="toggleFollowup" aria-label="收起团队跟进" title="收起团队跟进"><span data-icon="close"></span></button>
        </header>
        <div class="followup-scroll">
          <div class="team-assurance" id="teamAssurance"></div>
          <section class="followup-section" id="currentWorkSummary"></section>
          <section class="followup-section" id="followupDeliverables"></section>
          <section class="shared-work-stage" id="sharedWorkStage" aria-label="本轮团队协作" hidden></section>
          <section class="followup-section" id="followupAssignments"></section>
          <section class="followup-section" id="tracePanel" hidden><div class="section-label">协作记录</div><div id="workTrail"></div></section>
          <section class="followup-section" id="nextStepPanel"></section>
          <div class="followup-method"><span data-icon="learn"></span><div><strong>每一步，都讲清为什么</strong><p>用您的产品做一遍，再一起看看哪里要改。</p><button class="text-button" data-action="stageKnowledge">为什么先做这一步 <span data-icon="arrow"></span></button></div></div>
        </div>
        <aside class="work-list" id="expertRoster" aria-label="项目与专家团队">
          <div id="expertChain"></div>
          <div class="list-heading"><strong>一起帮您推进的专家</strong><span>分头准备，一起给建议</span></div>
          <div class="crew-list" id="crewList"></div>
          <div class="project-footer"><span class="project-footer-label">当前项目</span><div id="workList"></div><button class="icon-button" data-action="help" aria-label="关于出海工作室"><span data-icon="help"></span></button></div>
        </aside>
      </aside>
      <section class="main-pane">
        <section class="cabin" id="cabinView" aria-label="出海工作室">
          <section class="conversation" aria-label="与出海团队交流">
            <header class="conversation-head">
              <div class="chat-person"><div class="mini-portrait tone-blue" id="chatPortrait"></div><div><strong id="chatWith">出海战略专家</strong><span id="chatScope">帮您理清先做什么，再一起看结果</span></div></div>
              <div class="conversation-head-actions"><button class="text-button" id="demoExit" data-action="exitDemo" hidden>返回我的工作</button><button class="text-button chat-new-work" data-action="newConversation"><span data-icon="compose"></span>新工作</button><button class="text-button" data-action="scenarios">体验演示 <span data-icon="arrow"></span></button><button class="icon-button" data-action="toggleFollowup" id="followupToggle" aria-label="收起团队跟进" aria-expanded="true" title="团队跟进"><span data-icon="panel"></span></button></div>
            </header>
            <div class="conversation-scroll" id="conversationScroll" aria-live="polite"><div id="chatList"></div><details class="team-progress-details" id="teamProgressDetails" hidden><summary>看看团队怎样一起推进<span data-icon="chevron"></span></summary><div id="teamReview"></div><div id="inlineFollowupSlot"></div></details></div>
            <div class="launch-team-slot" id="launchTeamSlot"></div>
            <div class="conversation-composer">
              <div class="context-pill" id="contextPill" hidden><span data-icon="memory"></span><span id="contextText"></span><button data-action="clearContext" aria-label="清除当前对话产品背景">×</button></div>
              <div class="starter-actions" id="starterActions"><button data-send="先了解一下我们的工厂">从我的工厂开始 <span data-icon="arrow"></span></button><button data-action="productTool">已有产品资料 <span data-icon="attach"></span></button><button data-send="产品出海第一步应该做什么？">第一步怎么做 <span data-icon="arrow"></span></button></div>
              <form id="chatForm"><label for="chatInput" class="sr-only">您做什么产品？这次最想解决什么？</label><textarea id="chatInput" aria-label="说说您想先解决的事" name="work-message" autocomplete="off" rows="2" maxlength="3000" placeholder="说说您的产品，以及这次想解决什么…"></textarea><div class="composer-tools"><div><button type="button" class="composer-tool" data-action="upload" aria-label="发一份产品资料" title="发一份产品资料"><span data-icon="attach"></span></button><button type="button" class="composer-tool" data-action="capabilities" aria-label="看看团队能帮什么" title="看看团队能帮什么"><span data-icon="spark"></span></button><span class="composer-hint">回车发送</span></div><button class="send-button" type="submit" id="sendButton" aria-label="开始聊聊"><span data-icon="arrow"></span></button></div></form>
              <div class="launch-start-slot" id="launchStartSlot"></div>
              <div class="composer-status"><span id="composerState"><i></i>准备好一起推进</span><span>聊天不会自动存入工厂资料</span></div>
            </div>
          </section>
        </section>
        <section class="library-view" id="artifactsView" hidden aria-label="工作成果"></section>
        <section class="library-view" id="memoryView" data-upload-drop="materials" hidden aria-label="工厂资料"></section>
      </section>
    </div>
  </main>
</div>
<input type="file" id="fileInput" accept=".txt,.md,.csv,.json" hidden>
