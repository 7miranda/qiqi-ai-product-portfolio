      if (result.ok) { openExpert(b.dataset.styleSeat || b.dataset.styleExpert); notify('已记下表达偏好，后续回复会采用。'); } return;
    }
    if (b.dataset.chatArtifact) {
      const artifact = chat.artifacts.find(item => item.id === b.dataset.chatArtifact);
      if (artifact) openDrawer('团队准备 / 待核对草稿', '<h2 id="drawerTitle">' + esc(artifact.title) + '</h2><div class="source-note">' + esc(artifact.source) + '</div><pre class="chat-draft">' + esc(artifact.content) + '</pre>');
      return;
    }
    if (b.dataset.view) { closeDrawer(); setView(b.dataset.view); return; }
    if (b.dataset.week !== undefined) { state.week = Number(b.dataset.week); state.answer = null; setView('plan'); return; }
    if (b.dataset.course) { openCourse(b.dataset.course); return; }
    if (b.dataset.camp !== undefined) { openCamp(Number(b.dataset.camp)); return; }
    if (b.dataset.task !== undefined) { openTask(Number(b.dataset.task)); return; }
    if (b.dataset.startWeek !== undefined || b.dataset.useCourse) {
      state.week = b.dataset.startWeek !== undefined ? Number(b.dataset.startWeek) : D.camp.weeks.findIndex(w => w.courseIds.includes(b.dataset.useCourse));
      state.answer = null; closeDrawer(); setView('plan'); return;
    }
    if (b.dataset.expert) { openExpert(b.dataset.expert); return; }
    if (b.dataset.openFoundation) { state.series = 'foundation'; state.query = ''; closeDrawer(); setView('knowledge'); return; }
    if (b.dataset.category !== undefined) { state.materialCategory = Number(b.dataset.category); openFactory(); return; }
    if (b.dataset.series) { state.series = b.dataset.series; render(); return; }
    switch (b.dataset.action) {
      case 'home': setView('home'); break;
      case 'collapse-chat': chatDraft = $('#workspaceChatInput')?.value || chatDraft; chatOpen = false; render(); break;
      case 'new-chat': if (IncubationWorkbench.reset(chat).ok) { activeDockId = ''; conversationExpertId = ''; runFocusId = ''; chatDraft = ''; render(); } break;
      case 'close-work-card': hideExpertCard(true); break;
      case 'prepare-chat':
        runFocusId = conversationExpertId;
        dockScrollTop = 0;
        if ($('#departmentDock .dock-scroll')) $('#departmentDock .dock-scroll').scrollTop = 0;
        IncubationWorkbench.prepare(chat, { onChange: () => {
          activeDockId = shownOwner({owner:chat.selectedId}).id;
          if (state.view === 'home') {
            render();
            requestAnimationFrame(() => { const log = $('#workspaceMessages'); log?.scrollTo({ top:log.scrollHeight, behavior:'instant' }); });
          }
        }, yield: () => new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve))) }); break;
      case 'close-drawer': closeDrawer(); break;
      case 'factory': openFactory(); break;
      case 'robot-settings': openExpert(activeDockId || 'chengyuan'); break;
      case 'enterprise-knowledge': openEnterpriseKnowledge(); break;
      case 'confirm-company': enterprise.entries.filter(e=>e.status==='pending').forEach(e=>IncubationEnterprise.confirm(enterprise,e.id)); openEnterpriseKnowledge(); notify('已确认的资料可以供团队检索；资料更新后需重新核对。'); break;
      case 'company-question': closeDrawer(); chatOpen = true; setView('home'); $('#workspaceChatInput')?.focus({preventScroll:true}); break;
      case 'enterprise-connect': openDrawer('企业资料 / 连接现有系统', '<h2 id="drawerTitle">资料更新，团队也能接着看。</h2><p class="lead">先确定允许使用的资料范围，再由技术人员一次对接。老板不用配置接口。</p><div class="connection-options"><p><strong>企业文档</strong><span>同步指定文档和目录 · 待开通</span></p><p><strong>企业网盘</strong><span>读取授权文件夹 · 待开通</span></p><p><strong>订单与业务系统</strong><span>按授权范围接入 · 待开通</span></p></div><div class="source-note">这是接入位置预留，尚未连接真实系统。正式接入需验证企业身份、数据权限和版本；新资料先核对，再供专家使用。</div>'); break;
      case 'camp-overview': openDrawer('企业陪跑 / 服务框架', '<h2 id="drawerTitle">把课程，用到真实生意里。</h2><p class="lead">陪跑独立承接产品定位、渠道经营、团队培养和经营复盘。每个阶段把任务、所需知识和提交物放在一起。</p><h3>入营前，先带上</h3>' + list(D.camp.onboarding.inputs) + '<h3>六个阶段，跟着做</h3>' + D.camp.weeks.map((w, i) => '<button class="related-link" data-camp="' + i + '">' + String(i + 1).padStart(2, '0') + ' · ' + esc(w.title) + arrow + '</button>').join('') + '<h3>服务怎样衔接</h3>' + list(D.camp.serviceRoles.map(item => item.role + '：' + item.responsibility)) + '<div class="source-note">以上为营务分工框架，具体导师、助教与服务时间需确认。六阶段为自编界面示例，正式服务周期和收费另行确认。</div>'); break;
      case 'all-experts': openDrawer('专家团队 / 18位专家与经营主控', '<h2 id="drawerTitle">从产品，到客户，再到交付。</h2><p class="lead">不用逐个找人。围绕当前任务，选择需要的专业一起准备。</p><div class="team-grid">' + expertRows(allExperts.map(x => x.id)) + '</div><div class="source-note">专业分工示意；未安排真人或承诺集团部门支持。</div>'); break;
      case 'answer-detail': answerDetail(); break;
      case 'other-series': state.series = state.series === 'camp' ? 'foundation' : 'camp'; render(); break;
      case 'templates': openDrawer('知识库 / 实操步骤参考', '<h2 id="drawerTitle">把做法，变成能照着走的步骤。</h2><p class="lead">以下8项为平台整理的操作步骤框架，可配合课程与工厂任务使用。</p><div class="lesson-list">' + D.skills.map(item => '<details><summary>' + esc(item.name) + '</summary><h3>先准备</h3>' + list(item.inputs) + '<h3>跟着做</h3><ol>' + item.steps.map(step => '<li>' + esc(step) + '</li>').join('') + '</ol><h3>留下什么</h3>' + list(item.outputs) + '<h3>核对什么</h3>' + list(item.reviewPoints) + '</details>').join('') + '</div><div class="source-note">这些是步骤模板，不代表工具已经开通，也不替代负责人核对和操作授权。</div>'); break;
      case 'camp-framework': openDrawer('出海工厂陪跑营 / 六个演示栏目', campFramework()); break;
      case 'camp-resources': openDrawer('出海工厂陪跑营 / 常用资料', '<h2 id="drawerTitle">需要的资料，按用途放好。</h2><div class="lesson-list">' + D.camp.materialGroups.map(item => '<details><summary>' + esc(item.title) + '</summary><p>' + esc(item.description) + '</p><p>资料目录已保留，正文待盘点。</p></details>').join('') + '</div>' + source(D.camp.materialGroups[0].sourceUrl, '自编示例分类，仅供体验。')); break;
      case 'camp-glossary': openDrawer('出海工厂陪跑营 / 常见词', '<h2 id="drawerTitle">把常见的出海词，说明白。</h2><div class="lesson-list">' + D.camp.glossary.map(item => '<details><summary>' + esc(item.term) + '</summary><p>' + esc(item.definition) + '</p></details>').join('') + '</div>' + source(D.camp.glossary[0].sourceUrl, '常见词为通用示例说明。')); break;
      case 'camp-platforms': openDrawer('出海工厂陪跑营 / 配套课程', '<h2 id="drawerTitle">按选定的渠道，继续补课。</h2>' + D.camp.platformRoutes.map(route => '<h3>' + esc(route.title) + ' · ' + route.chapterCount + '章' + route.lessonCount + '节</h3><div class="lesson-list">' + route.chapters.map(c => '<details><summary>' + c.number + ' · ' + esc(c.title) + '</summary>' + list(c.lessons.map(l => l.number + ' ' + l.title)) + '</details>').join('') + '</div>' + source(route.sourceUrl, route.scope)).join('') + '<h3>其他平台路线与获客专题</h3><p class="lead">公开版仅展示自编示例。正式课程与平台细则不在此页提供。</p>'); break;
      case 'knowledge-sources': openDrawer('知识库 / 内容收录', '<h2 id="drawerTitle">两套内容，分别保留来源。</h2><h3>出海工厂陪跑营</h3><p class="lead">保留入营信息、六周目标、任务、提交物与验收要求，关联所需基础章节。</p>' + source(D.camp.sourceUrl, '自编演示框架') + source(D.camp.assignmentSourceUrl, '自编阶段任务') + '<h3>基础课程</h3><p class="lead">16章64节演示结构，使用通用主题和自编练习，仅用于体验课程与任务的关联。</p>' + source(D.foundation.sourceUrl, '自编基础课程示例') + '<div class="source-note">公开演示使用独立编写的通用示例，展示课程与任务如何衔接；不含企业资料、内部课程原文或完整教学内容，亦未做外部规则核验。</div>'); break;
      case 'scope': openDrawer('在线演示 / 功能范围', '<h2 id="drawerTitle">先把陪跑的框架搭起来。</h2><p class="lead">这一版可浏览两套课程的自编示例、关联阶段任务，用虚构资料体验团队协作。输入内容只在当前页面暂存，不会保存。</p><h3>后续接上正式服务</h3><p class="lead">企业数据、线上模型、真实专家排班、课程视频与服务购买尚未开通。不会自动投放、发消息、付款或承诺经营收益。</p><div class="source-note">在线演示使用示例资料；当前页面内容关闭后不保留。完整客户端在本机运行。</div>'); break;
    }
  });
  document.addEventListener('input', event => {
    if (event.target.id === 'workspaceChatInput') { chatDraft = event.target.value;  return; }
    if (event.target.id !== 'courseSearch') return;
    state.query = event.target.value;
    $('#campCount').textContent = state.query ? filtered('camp').length + extraMatches().length + ' 项' : '6 阶段';
    $('#foundationCount').textContent = filtered('foundation').length + ' 章';
    $('#libraryResults').innerHTML = catalogue();
  });
  document.addEventListener('submit', event => {
    if (event.target.id === 'workspaceChatForm') { event.preventDefault(); sendChat($('#workspaceChatInput').value); return; }
    if (!['questionForm', 'taskForm', 'materialForm'].includes(event.target.id)) return;
    event.preventDefault();
    if (event.target.id === 'questionForm') {
      const value = $('#questionInput').value.trim(); if (!value) { $('#questionInput').focus(); return; }
      lastQuestion = value; state.answer = ExpertNetwork.answerQuestion(value); render(); return;
    }
    if (event.target.id === 'taskForm') {
      const facts = $('#taskFacts').value.trim(), uncertain = $('#taskUncertain').value.trim();
      if (!facts || !uncertain) { $('#taskError').textContent = '把已知情况和待确认的事各留一句，就能继续。'; return; }
      const w = D.camp.weeks[Number(event.target.dataset.index)];
      state.submissions[w.id] = { facts, uncertain }; closeDrawer(); render(); notify('这一步已记下，留待核对。本次页面关闭后不保存。'); return;
    }
    const title = $('#materialTitle').value.trim(), content = $('#materialText').value;
    if (!title || !content.trim()) { $('#materialError').textContent = '请补上资料名称和内容。'; return; }
    if (content.length > 50000) { $('#materialError').textContent = '资料超过5万字，请分成几份再放入。'; return; }
    const imported = IncubationEnterprise.importText(enterprise,{title,content});
    if (!imported.ok) { $('#materialError').textContent = imported.error; return; }
    if (!imported.duplicate) state.materials.push({ title, content, category: state.materialCategory });
    openEnterpriseKnowledge(); notify(imported.duplicate ? '内容未变，保留原有核对状态。' : '已按原文整理业务知识，请先过目。');
  });
  document.addEventListener('change', event => { if (event.target.id === 'materialFile') readMaterial(event.target.files[0]); });
  document.addEventListener('dragover', event => { const zone = event.target.closest('#fileDrop'); if (zone) { event.preventDefault(); zone.classList.add('dragover'); } });
  document.addEventListener('dragleave', event => { event.target.closest('#fileDrop')?.classList.remove('dragover'); });
  document.addEventListener('drop', event => { const zone = event.target.closest('#fileDrop'); if (zone) { event.preventDefault(); zone.classList.remove('dragover'); readMaterial(event.dataTransfer.files[0]); } });
  $('#drawerBackdrop').addEventListener('click', closeDrawer);
  document.addEventListener('keydown', event => {
    if (event.target.matches?.('[role="tab"]') && ['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(event.key)) {
      event.preventDefault();
      state.series = event.key === 'Home' ? 'camp' : event.key === 'End' ? 'foundation' : state.series === 'camp' ? 'foundation' : 'camp';
      render(); $('#' + (state.series === 'camp' ? 'campTab' : 'foundationTab')).focus({ preventScroll: true }); return;
    }
    if (event.target.id === 'questionInput' && event.key === 'Enter' && !event.shiftKey) {
      event.preventDefault(); $('#questionForm').requestSubmit(); return;
    }
    if (event.target.id === 'workspaceChatInput' && event.key === 'Enter' && !event.shiftKey && !event.isComposing) {
      event.preventDefault(); $('#workspaceChatForm').requestSubmit(); return;
    }
    if (event.key === 'Escape' && previewExpertId) { hideExpertCard(true); return; }
    if ($('#drawer').hidden) {
      if (event.key === 'Escape' && chatOpen && state.view === 'home') {
        chatDraft = $('#workspaceChatInput')?.value || chatDraft; chatOpen = false; render();
      }
      return;
    }
    if (event.key === 'Escape') { closeDrawer(); return; }
    if (event.key !== 'Tab') return;
    const items = Array.from($('#drawer').querySelectorAll('button,input,textarea,a[href],summary')).filter(e => !e.disabled && e.getClientRects().length);
    const first = items[0], last = items.at(-1);
    if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
    else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
  });
  document.addEventListener('mouseover', event => {
    const seat = event.target.closest('[data-preview-expert]');
    if (seat && event.pointerType !== 'touch' && seat.dataset.previewExpert !== previewExpertId) showExpertCard(seat.dataset.previewExpert);
  });
  $('#departmentDock').addEventListener('mouseleave', deferHideExpertCard);
  $('#expertWorkCard').addEventListener('mouseenter', () => clearTimeout(previewCloseTimer));
  $('#expertWorkCard').addEventListener('mouseleave', deferHideExpertCard);
  document.addEventListener('click', event => { if (!event.target.closest('#departmentDock,#expertWorkCard')) hideExpertCard(); });
  document.addEventListener('focusin', event => {
    const seat = event.target.closest('[data-preview-expert]');
    if (seat && !suppressPreviewFocus) showExpertCard(seat.dataset.previewExpert);
    if (event.target.id === 'workspaceChatInput' && !chatOpen) activateChat();
    if (event.target.closest('nav [data-view]')) updateNav(event.target.closest('nav [data-view]'));
  });
  $('nav').addEventListener('pointerover', event => { const button = event.target.closest('[data-view]'); if (button) updateNav(button); });
  $('nav').addEventListener('pointerleave', () => updateNav());
  window.addEventListener('resize', () => { updateNav(); if(previewExpertId) positionExpertCard(previewExpertId); }, { passive:true });
  function showDemoSources() {
    openDrawer('在线演示 / 示例资料说明', '<h2 id="drawerTitle">这是公开演示，不是内部课程。</h2><p class="lead">公开演示使用独立编写的通用示例，展示课程与任务如何衔接；不含企业资料、内部课程原文或完整教学内容，亦未做外部规则核验。</p><h3>这一版能体验什么</h3><p>18位专业席位、经营主控、任务准备与交接、两套课程结构，以及虚构资料的分类与确认。</p><h3>资料从哪里来</h3><p>奥吉科技 · 自编出海业务演示资料。16个通用主题、六阶段任务与练习由本公开版独立编写。引用只回到本页，不代表经过外部或实时政策核验。</p><h3>工作资料怎样处理</h3><p>此页不连接企业系统、不调用线上模型，也不保存输入内容。请使用虚构资料。完整客户端在本机运行。</p>');
  }
  document.addEventListener('click', event => {
    if (event.target.closest('a[href*="#demo-sources"]')) { event.preventDefault(); showDemoSources(); }
  });
  render();
  if (location.hash === '#demo-sources') showDemoSources();
})();
</script>
</body>
</html>
